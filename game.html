<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F121A">
<title>Gomoku Rush — 五子棋限時解題</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gomoku Rush">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* 2026-11-07 設計稿 C 開始＋C 解題（加 A 升段條）＋A 結算；第二輪一屏版選 V1 圖示列（開始右上語言／排行榜 icon，結算底部 icon 列）；畫布 https://claude.ai/artifact/XqbiqLiesB2sLJxbkw9e9c */
:root {
  --bg: #0F121A; --panel: #161A24; --panel2: #1F2A3D; --line: #252B3A; --line2: #2E3546;
  --text: #EDEFF5; --text2: #B6BCCB; --gold: #F2B544; --goldBg: #3A2F17; --goldInk: #1A1300;
  --teal: #3CC6B4; --tealBg: #1F3B39; --tealInk: #06231F; --fail: #FF7A6B; --failBg: #3D1F1F;
  --num: 'Chakra Petch', 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; }
html, body { touch-action: manipulation; margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; -webkit-text-size-adjust: 100%; }
:lang(ja) body, body:lang(ja) { font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif; }
:lang(ko) body, body:lang(ko) { font-family: 'Noto Sans KR', 'Noto Sans TC', sans-serif; word-break: keep-all; }
.topbar { position: relative; display: flex; justify-content: space-between; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 8px 0; }
.topbar > div { display: flex; }
.icob { width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.icob.gold { color: var(--gold); }
.ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.langs { position: absolute; right: 8px; top: calc(56px + env(safe-area-inset-top)); z-index: 5; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.langs[hidden] { display: none; }
.langs button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: var(--text); font-size: 16px; text-align: left; }
.langs button[aria-pressed="true"] { color: var(--gold); font-weight: 700; }
.sq { width: 64px; height: 60px; flex: none; border: 0; border-radius: 16px; background: var(--panel); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; }
.sq .ico { width: 22px; height: 22px; }
.sq.gold { color: var(--gold); }
.sq span { color: var(--text2); }
body { min-height: 100dvh; }
button, a, input { touch-action: manipulation; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.screen[hidden] { display: none; }
.pad { padding-left: 20px; padding-right: 20px; }
.muted { color: var(--text2); }
.btn { height: 60px; border-radius: 18px; border: 0; font-size: 20px; font-weight: 900; }
.btn.gold { background: var(--gold); color: var(--goldInk); }
.btn.teal { background: var(--teal); color: var(--tealInk); }
.btn.ghost { background: transparent; border: 1px solid var(--line2); color: var(--text); font-size: 16px; font-weight: 500; }
.btn.link { height: 48px; background: transparent; color: var(--gold); font-size: 16px; font-weight: 500; }
.thumb { padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }

/* 開始 */
#sStart .hero { padding-top: 4px; display: flex; flex-direction: column; align-items: center; text-align: center; }
#sStart .big60 { font-family: var(--num); font-size: clamp(80px, 14dvh, 120px); font-weight: 700; line-height: 1; color: var(--gold); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 56px; height: 56px; border-radius: 16px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font-size: 28px; }
.stepper .val { flex: 1; height: 56px; border-radius: 16px; background: var(--goldBg); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--gold); }
.stepper .val b { font-size: 26px; }
input.nick { width: 100%; height: 52px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font: inherit; font-size: 18px; padding: 0 16px; }

/* 解題 */
.hud { padding: calc(14px + env(safe-area-inset-top)) 16px 6px; display: flex; align-items: flex-end; justify-content: space-between; }
.hud .lbl { font-size: 13px; color: var(--text2); }
.hud .n { font-family: var(--num); font-size: 52px; font-weight: 700; line-height: 1; }
.plus { font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--teal); opacity: 0; transition: opacity .2s; }
.plus.on { opacity: 1; }
.lives { display: inline-flex; gap: 5px; vertical-align: middle; }
.lives i { width: 13px; height: 13px; border-radius: 50%; background: var(--fail); display: inline-block; }
.lives i.off { background: transparent; border: 2px solid var(--failBg); }
.bars { padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 6px; }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--line); }
.bar > div { height: 100%; border-radius: 5px; transition: width .15s linear; }
.bar .mark { position: absolute; left: 80%; top: -4px; width: 3px; height: 18px; background: var(--text); border-radius: 2px; }
.barrow { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--text2); }
.boardWrap { position: relative; align-self: center; touch-action: manipulation; }
canvas#board { display: block; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.flash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.flash[hidden] { display: none; }
.flash span { padding: 14px 30px; border-radius: 20px; font-size: 44px; font-weight: 900; background: rgba(15,18,26,.9); display: inline-flex; align-items: center; gap: 14px; }
.flash .stone { width: 36px; height: 36px; border-radius: 50%; display: inline-block; }
.flash.bad span { font-size: 24px; color: var(--fail); border: 2px solid var(--fail); }
.flash.warn span { font-size: 22px; color: var(--gold); border: 2px solid var(--gold); flex-direction: column; gap: 4px; }
.flash.good span { font-size: 26px; color: var(--teal); border: 2px solid var(--teal); flex-direction: column; gap: 4px; }
.info { padding: 10px 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text2); }
.atk { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 700; }
.atk i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.hint { padding: 6px 20px 0; font-size: 15px; color: var(--text2); }

/* 結算 */
#sEnd .top { padding-top: calc(28px + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stamp { width: clamp(140px, 24dvh, 176px); height: clamp(140px, 24dvh, 176px); flex: none; border-radius: 50%; border: 7px double var(--gold); color: var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg); }
.stamp.down { border-color: var(--fail); color: var(--fail); }
.stamp b { font-size: 50px; font-weight: 900; line-height: 1.05; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.tiles div { background: var(--panel); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; }
.tiles span { font-size: 13px; color: var(--text2); }
.tiles b { font-family: var(--num); font-size: 26px; }
.sheet { margin-top: 16px; flex: 1; border-radius: 24px 24px 0 0; background: var(--panel); border-top: 1px solid var(--line2); padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.grip { align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line2); }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; min-height: 44px; border-radius: 12px; border: 0; background: var(--panel2); color: var(--text2); font-size: 15px; }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--goldInk); font-weight: 700; }
.scope { display: flex; gap: 6px; justify-content: flex-end; }
.scope button { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: transparent; color: var(--text2); font-size: 14px; }
.scope button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 8px; padding: 10px 6px; border-top: 1px solid var(--line); font-size: 16px; }
.row.me { background: var(--tealBg); border-radius: 10px; }
.row .no { width: 28px; font-family: var(--num); color: var(--text2); }
.row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rk { min-width: 52px; color: var(--gold); font-weight: 700; white-space: nowrap; }
.row .vl { width: 60px; text-align: right; font-family: var(--num); }

/* 浮層：排行榜、看我解的題 */
.modal { position: fixed; inset: 0; background: rgba(5,7,12,.7); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.modal[hidden] { display: none; }
.modal .box { width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto; border-radius: 24px 24px 0 0; background: var(--panel); padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.modal h2 { margin: 4px 0 0; font-size: 20px; }
.rev { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--line); font-size: 15px; }
.rev .tag { padding: 2px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.rev .tag.ok { background: var(--tealBg); color: var(--teal); }
.rev .tag.ng { background: var(--failBg); color: var(--fail); }
.rev .tx { flex: 1; min-width: 0; }
.rev .pid { display: block; font-family: var(--num); font-size: 12px; color: var(--text2); }
.rev .rpt { min-height: 44px; padding: 0 10px; border: 1px solid var(--line2); border-radius: 12px; background: transparent; color: var(--text2); font-size: 13px; white-space: nowrap; }
.rform { display: flex; flex-direction: column; gap: 8px; padding: 10px 4px 14px; font-size: 14px; }
.rform .kinds { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.rform label { min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.rform textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line2); border-radius: 12px; padding: 8px 10px; font: inherit; }
.rev a { color: var(--gold); white-space: nowrap; min-height: 44px; display: inline-flex; align-items: center; }
@media (prefers-reduced-motion: reduce) { .bar > div, .plus { transition: none; } }
</style>
</head>
<body>
<div class="app">

<!-- 開始（設計稿 C1） -->
<section id="sStart" class="screen">
  <div class="topbar">
    <a href="score.html" class="icob" aria-label="詰題試煉場" data-i18n-aria="backA"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/><circle cx="15" cy="9" r="2.2" fill="currentColor"/></svg></a>
    <div>
      <button type="button" class="icob" data-sound aria-pressed="true"></button>
      <button type="button" class="icob" id="langBtn" aria-label="Language" aria-haspopup="true" aria-expanded="false" aria-controls="langs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></button>
      <button type="button" class="icob gold" id="openBoard" aria-label="看排行榜" data-i18n-aria="openBoard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg></button>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language" hidden></div>
  </div>
  <div class="hero pad">
    <span class="big60">60</span>
    <span style="font-size: 18px; font-weight: 700;" data-i18n="heroSub">秒・VCF 衝分</span>
    <span class="muted" style="margin-top: 6px; font-size: 15px;" data-i18n="heroRule">答對 +20 秒・錯 3 題結束</span>
  </div>
  <div class="pad" style="padding-top: 32px; display: flex; flex-direction: column; gap: 8px;">
    <span class="muted" style="font-size: 15px;" data-i18n="startRank">起始段位</span>
    <div class="stepper">
      <button type="button" id="rkDown" aria-label="降一段" data-i18n-aria="rkDown">−</button>
      <div class="val" aria-live="polite"><b id="rkName">三段</b><span id="rkBand" style="font-size: 13px;"></span></div>
      <button type="button" id="rkUp" aria-label="升一段" data-i18n-aria="rkUp">+</button>
    </div>
    <span class="muted" id="rkKeep" hidden style="font-size: 13px; line-height: 1.5;"></span>
  </div>
  <div class="pad" style="padding-top: 20px; display: flex; flex-direction: column; gap: 8px;">
    <label for="nick" class="muted" style="font-size: 15px;" data-i18n="nick">暱稱</label>
    <input id="nick" class="nick" maxlength="12" autocomplete="nickname" placeholder="上排行榜用的名字" data-i18n-ph="nickPh">
  </div>
  <div style="flex: 1;"></div>
  <div class="thumb" style="flex-direction: column;">
    <span class="muted" id="startMsg" role="status" style="font-size: 14px; text-align: center; min-height: 20px;"></span>
    <button type="button" class="btn gold" id="go" style="height: 64px; font-size: 23px;" data-i18n="go">開始</button>
  </div>
</section>

<!-- 解題（設計稿 C2＋A 升段條） -->
<section id="sPlay" class="screen" hidden>
  <div class="hud">
    <div>
      <div class="lbl" data-i18n="timeLeft">剩餘秒數</div>
      <div style="display: flex; align-items: baseline; gap: 8px;"><span class="n" id="tLeft">60</span><span class="plus" id="tPlus">+20</span></div>
    </div>
    <div style="text-align: right;">
      <div class="lbl" data-i18n="solvedN">答對</div>
      <div class="n" id="tot" style="color: var(--gold);">0</div>
    </div>
  </div>
  <!-- 能力分與目前段位解題時不顯示，結算才公布（使用者 2026-11-07） -->
  <div class="bars"><div class="barrow" style="align-items:center"><button type="button" class="icob" data-sound aria-pressed="true" style="width:44px;height:44px;margin-left:-10px"></button><span><span data-i18n="lives">可錯</span> <span class="lives" id="lives"></span></span></div></div>
  <div class="boardWrap" id="boardWrap">
    <canvas id="board" aria-label="題目棋盤，點一下選位置，同一格再點一下就下" data-i18n-aria="boardAria"></canvas>
    <div class="flash" id="flash" hidden></div>
  </div>
  <div class="info"><span class="atk" id="atkInfo"></span><span id="pTime">本題 0 秒</span></div>
  <div class="hint" data-i18n="hint">同一格點兩下就下，或按確定</div>
  <div style="flex: 1;"></div>
  <div class="thumb">
    <button type="button" class="btn ghost" id="skip" style="flex: 1; height: 56px; font-size: 16px; color: var(--text2);" data-i18n="skip">跳過</button>
  </div>
</section>

<!-- 結算（設計稿 A3） -->
<section id="sEnd" class="screen" hidden>
  <div class="top pad">
    <span class="muted" id="endWhy" style="font-size: 16px;">時間到</span>
    <div class="stamp" id="stamp"><span style="font-size: 14px;" data-i18n="finalLbl">結算段位</span><b id="endRank">三段</b><span id="endNote" style="font-size: 13px;">升段了</span></div>
    <div class="tiles">
      <div><span data-i18n="abLbl">能力分</span><b id="eAb">0</b></div>
      <div><span data-i18n="solvedN">答對</span><b id="eSolved">0</b></div>
      <div><span data-i18n="todayNo">今天第</span><b id="eToday" style="color: var(--gold);">–</b></div>
    </div>
    <span id="ePts" style="font-size: 15px; text-align: center;"></span>
    <span class="muted" id="ePlace" role="status" style="font-size: 15px; text-align: center;"></span>
    <button type="button" class="btn link" id="retrySubmit" hidden data-i18n="retry">重新送出成績</button>
  </div>
  <div style="flex: 1;"></div>
  <div class="thumb" style="align-items: center; gap: 8px;">
    <button type="button" class="sq gold" id="endBoardBtn" aria-label="看排行榜" data-i18n-aria="openBoard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg><span data-i18n="boardShort">排行</span></button>
    <button type="button" class="sq" id="openReview" aria-label="看我解的題" data-i18n-aria="review"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg><span data-i18n="revShort">題目</span></button>
    <button type="button" class="btn gold" id="again" style="flex: 1; font-size: 20px;" data-i18n="again">再來一局</button>
  </div>
</section>
</div>

<div class="modal" id="mBoard" hidden role="dialog" aria-modal="true" aria-labelledby="mBoardT">
  <div class="box"><div class="grip"></div><div style="display:flex;align-items:center;justify-content:space-between"><h2 id="mBoardT" data-i18n="boardT">排行榜</h2><button type="button" class="icob" data-close aria-label="關閉" data-i18n-aria="close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="startBoard"></div></div>
</div>
<div class="modal" id="mReview" hidden role="dialog" aria-modal="true" aria-labelledby="mReviewT">
  <div class="box"><div class="grip"></div><div style="display:flex;align-items:center;justify-content:space-between"><h2 id="mReviewT" data-i18n="reviewT">這局的題目</h2><button type="button" class="icob" data-close aria-label="關閉" data-i18n-aria="close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="revList"></div></div>
</div>

<script>
'use strict';
// ---------- 規則常數（2026-11-07 使用者定：60 秒、答對 +20 秒、錯 3 題結束、起始段位 ±1 抽題；沒升段＝沒證明起始段位，降段不入榜） ----------
const API = 'https://vcf-game-api.psyhangsau.workers.dev';
// 能力分（2026-11-07，仿 Lichess 解題積分）：人和題目用同一把尺＝題目分。能力分落在哪段的題目分區間就是哪段（沿用網站段位門檻）。
// 每題先算預期解開機率 P＝1/(1+exp((ln題目分−ln能力分)/SPREAD))；解開 S=1、答錯／跳過 S=0；ln能力分 += K×(S−P)。
// 解開比自己難的題加得多、簡單題答錯扣得多；可升可降，停在哪個區間就是哪段。時間到時做到一半的題不算。
const LOW = [0, 40, 70, 120, 200, 315, 500, 780, 1210];   // 各段題目分下限（網站段位尺）
const START_AB = [30, 53, 92, 155, 251, 397, 624, 971];  // 起始能力分＝起始段位區間的幾何中點
const SPREAD = 0.5;   // 難一段（約 ×1.65）時預期解開率約 27%
const K_STEP = 0.4;   // 一題最多讓能力分 ×1.5 或 ÷1.5；一局只有幾題，要調得快

// ---------- 聲音（2026-11-07 使用者：落子聲、最後 5 秒倒數聲、聲音開關）：Web Audio 現場合成，不用音檔 ----------
const SND_ON = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>`, SND_OFF = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;
let soundOn = store.get('vcfgame.sound') !== '0', actx = null;
function audio() {   // 手機要在使用者點擊時才能開聲音，所以第一次點按鈕／棋盤時建立
  if (!soundOn) return null;
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch { actx = null; }
  return actx;
}
function stoneSound(soft) {   // 落子：短促的木頭「叩」聲（帶通雜訊＋低頻敲擊）；電腦擋的那手小聲一點
  const a = audio(); if (!a) return;
  const t = a.currentTime, vol = soft ? 0.35 : 0.6;
  const n = a.createBuffer(1, Math.floor(a.sampleRate * 0.06), a.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const src = a.createBufferSource(); src.buffer = n;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 1.4;
  const g1 = a.createGain(); g1.gain.setValueAtTime(vol, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  src.connect(bp).connect(g1).connect(a.destination); src.start(t);
  const o = a.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.08);
  const g2 = a.createGain(); g2.gain.setValueAtTime(vol * 0.7, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g2).connect(a.destination); o.start(t); o.stop(t + 0.1);
}
function beep(last) {   // 倒數：5、4、3、2 短嗶，最後 1 秒高一點、長一點
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), gn = a.createGain();
  o.type = 'sine'; o.frequency.value = last ? 1320 : 880;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.35, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + (last ? 0.35 : 0.12));
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + (last ? 0.4 : 0.15));
}
function renderSound() {

}

// ---------- 題庫 ----------
const files = {};
async function loadFile(k) {
  if (!files[k]) files[k] = fetch(`game/p/${k}.json?v=20261107`).then(r => { if (!r.ok) throw new Error('題庫讀不到'); return r.json(); });
  return files[k];
}
// 從能力分附近抽題（題目分在能力分 ÷1.25～×1.25；不夠就放寬），難度剛好在解開一半左右時量得最準
function filesFor(lo, hi) {   // 題庫檔 k 收題目分 [LOW[k], LOW[k+1])，七段檔也收八段
  const ks = [];
  for (let k = FILE_MIN; k <= FILE_MAX; k++) if (LOW[k] <= hi && (k === FILE_MAX || LOW[k + 1] > lo)) ks.push(k);
  return ks.length ? ks : [lo < LOW[FILE_MIN] ? FILE_MIN : FILE_MAX];
}
// 題號（2026-11-07）：題庫第 6 欄；舊題庫沒有就用同一套算法現算（黑白子排序＋攻方 → SHA-1 前 40 位元 → 8 碼）
let BLOCKED = new Set();
fetch(API + '/blocked').then(r => r.json()).then(j => { BLOCKED = new Set(j.ids || []); }).catch(() => {});
const CROCK = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
async function puzzleId(b, w, a) {
  const norm = s => s.split(' ').filter(Boolean).sort().join(' ');
  const h = new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(`${norm(b)}|${norm(w)}|${a}`)));
  let n = 0n; for (let i = 0; i < 5; i++) n = (n << 8n) | BigInt(h[i]);
  let out = ''; for (let i = 0; i < 8; i++) out += CROCK[Number((n >> BigInt(35 - 5 * i)) & 31n)];
  return out;
}
async function pickPuzzle(ab, used) {
  for (const f of [1.25, 1.6, 2.5, 1e9]) {
    const lo = ab / f, hi = ab * f, cands = [];
    for (const k of filesFor(lo, hi)) {
      const list = await loadFile(k);
      list.forEach((x, j) => { if (x[3] >= lo && x[3] <= hi && !used.has(k + ':' + j) && !(x[5] && BLOCKED.has(x[5]))) cands.push([k, j, x]); });
    }
    if (!cands.length) continue;
    const [k, j, x] = cands[Math.floor(Math.random() * cands.length)];
    used.add(k + ':' + j);
    const [black, white, L, score, atk, id] = x;
    return { rank: rankOf(score), black: black.split(' '), white: white.split(' '), L, score, atkWhite: atk === 'w', id: id || '' };
  }
  throw new Error('沒有題目了');
}

// ---------- 棋盤 ----------
const cv = $('board'), ctx = cv.getContext('2d');
let px = 390, cell = 24, pad = 14;
function layout() {
  const w = Math.min(document.querySelector('.app').clientWidth, 520);
  px = Math.max(300, Math.min(w - 16, window.innerHeight - 340));   // 左右各留 8px，邊線的子才點得到
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(px * dpr); cv.height = Math.round(px * dpr);
  cv.style.width = px + 'px'; cv.style.height = px + 'px';
  $('boardWrap').style.width = px + 'px'; $('boardWrap').style.height = px + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pad = px * 0.045; cell = (px - 2 * pad) / (N - 1);
  draw();
}
const xy = (t) => [pad + COLS.indexOf(t[0]) * cell, pad + (N - parseInt(t.slice(1), 10)) * cell];
function stone(t, black, alpha) {
  const [x, y] = xy(t), r = cell * 0.46;
  ctx.globalAlpha = alpha ?? 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = black ? '#1B1A17' : '#FBFAF6'; ctx.fill();
  if (!black) { ctx.lineWidth = 1.5; ctx.strokeStyle = '#1B1A17'; ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.clearRect(0, 0, px, px);
  ctx.fillStyle = '#E9C98B';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0, 0, px, px, 10) : ctx.rect(0, 0, px, px); ctx.fill();
  ctx.strokeStyle = '#5B4524'; ctx.lineWidth = 1;
  for (let i = 0; i < N; i++) {
    const o = Math.round(pad + i * cell) + 0.5;
    ctx.beginPath(); ctx.moveTo(pad, o); ctx.lineTo(px - pad, o); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o, pad); ctx.lineTo(o, px - pad); ctx.stroke();
  }
  ctx.fillStyle = '#5B4524';
  for (const t of ['D4', 'D12', 'L4', 'L12', 'H8']) { const [x, y] = xy(t); ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); }
  if (!g || !g.p) return;
  for (const t of g.black) stone(t, true);
  for (const t of g.white) stone(t, false);
  if (g.lastDef) { const [x, y] = xy(g.lastDef); ctx.fillStyle = '#FF7A6B'; ctx.beginPath(); ctx.arc(x, y, cell * 0.12, 0, Math.PI * 2); ctx.fill(); }
  if (g.ghost) {
    stone(g.ghost, !g.p.atkWhite, 0.55);
    const [x, y] = xy(g.ghost);
    ctx.lineWidth = 3; ctx.strokeStyle = '#3CC6B4';
    ctx.beginPath(); ctx.arc(x, y, cell * 0.7, 0, Math.PI * 2); ctx.stroke();
  }
}
function cellAt(ev) {
  const r = cv.getBoundingClientRect();
  const c = Math.round((ev.clientX - r.left - pad) / cell), row = Math.round((ev.clientY - r.top - pad) / cell);
  if (c < 0 || c >= N || row < 0 || row >= N) return null;
  return COLS[c] + (N - row);
}

let g = null;

function show(id) { for (const s of ['sStart', 'sPlay', 'sEnd']) $(s).hidden = s !== id; window.scrollTo(0, 0); }

function tick(t) {
  if (!g || g.over) return;
  const dt = g.lastT ? Math.min(MAX_DT, (t - g.lastT) / 1000) : 0;
  g.lastT = t;
  if (!g.hold) {
    const before = Math.ceil(g.left);
    g.left -= dt; g.elapsed += dt; g.psec += dt;
    const now = Math.ceil(g.left);
    if (now !== before && now >= 1 && now <= 5) beep(now === 1);   // 最後 5 秒每秒一聲
    if (g.left <= 0) { g.left = 0; renderHud(); endGame(T('endTime')); return; }
  }
  renderHud();
  requestAnimationFrame(tick);
}
const atkName = (p) => p.atkWhite ? T('white') : T('black');
function renderHud() {
  $('tLeft').textContent = Math.ceil(g.left);
  $('tot').textContent = g.solved;
  $('lives').innerHTML = Array.from({ length: MAX_WRONG }, (_, i) => `<i class="${i < MAX_WRONG - g.wrong ? '' : 'off'}"></i>`).join('');

}
function setGhost(t) {
  g.ghost = t;
  draw();
}
function flash(html, cls, ms) {
  const f = $('flash');
  f.className = 'flash' + (cls ? ' ' + cls : ''); f.innerHTML = `<span>${html}</span>`; f.hidden = false;
  return new Promise(r => setTimeout(() => { f.hidden = true; r(); }, ms));
}

async function nextPuzzle() {
  g.hold = true;
  let p;
  try { p = await pickPuzzle(g.ab, g.used); }
  catch { endGame(T('endNoPuzzle')); return; }
  g.p = p; g.black = [...p.black]; g.white = [...p.white]; g.lastDef = null; g.psec = 0; g.moves = []; g.wf = 0; g.wn = 0;
  setGhost(null);
  $('atkInfo').innerHTML = `<i style="background:${p.atkWhite ? '#FBFAF6' : '#1B1A17'};border:1.5px solid #FBFAF6"></i>${atkName(p)}`;
  renderHud();
  // 每題都閃一下黑先／白先（使用者 2026-11-07：同色也要閃），閃的時候不扣秒
  await flash(`<i class="stone" style="background:${p.atkWhite ? '#FBFAF6' : '#1B1A17'};border:2px solid #FBFAF6"></i>${atkName(p)}`, '', FLASH_MS);
  if (!g.over) g.hold = false;
}

async function placeAt(t) {
  if (!g || g.hold || g.over || !t) return;
  if (g.black.includes(t) || g.white.includes(t)) return;
  g.hold = true; setGhost(null);
  const p = g.p, atk = p.atkWhite ? g.white : g.black, def = p.atkWhite ? g.black : g.white;
  const res = (await play(g.black.join(' '), g.white.join(' '), t, p.atkWhite)).result || { r: 'illegal' };
  g.moves.push(t);
  if (res.r === 'illegal') { g.moves.pop(); g.hold = false; return; }
  if (res.r === 'mustblock') return wrong('mustblock', res.at);
  if (res.r === 'forbidden' || res.r === 'notfour') return warn(res.r);
  atk.push(t); stoneSound();
  if (res.r === 'win') { draw(); return solved(res.how); }
  if (res.r === 'block') {
    def.push(res.def); g.lastDef = res.def; setTimeout(() => stoneSound(true), 160);   // 電腦擋，晚一點、小聲一點
    draw();
    if (res.lost) return wrong('lost');
    if (res.vcf === 0) return wrong('novcf');
    g.hold = false;   // vcf>0，或搜太久沒算完（-1）就當還有路，繼續
    return;
  }
  wrong('bad');
}

async function warn(k) {   // 禁手／不是四：提醒一下，棋子不留、不扣可錯次數、不動能力分
  g.moves.pop(); draw();
  if (k === 'forbidden') g.wf++; else g.wn++;   // 後台統計用（2026-11-07）
  await flash(T('why_' + k) + '<br><small>' + T('noMiss') + '</small>', 'warn', WARN_MS);
  if (!g.over) g.hold = false;
}

async function solved(how) {
  const p = g.p, sec = g.psec;
  const d = updateAbility(true);
  g.total += p.score; g.left += BONUS_SEC; g.solved++;
  g.log.push({ b: p.black.join(' '), w: p.white.join(' '), a: p.atkWhite ? 'w' : 'b', id: p.id, r: p.rank, L: p.L, s: p.score, e: d, ok: 1, sec: +sec.toFixed(1), how, m: g.moves.join(' '), wf: g.wf, wn: g.wn });
  $('tPlus').classList.add('on'); setTimeout(() => $('tPlus').classList.remove('on'), 1200);
  renderHud();
  await flash(T('ok', { b: BONUS_SEC }), 'good', FEED_MS);
  if (!g.over) nextPuzzle();
}

function updateAbility(ok) {   // 回傳能力分變化（整數）
  const before = g.ab, P = expectP(g.ab, g.p.score);
  const k = !ok && g.solved === 0 ? K_FAST : K_STEP;   // g.solved 在解開後才 +1，所以解開的那一題本身也用正常幅度
  g.ab = Math.exp(Math.log(g.ab) + k * ((ok ? 1 : 0) - P));
  g.cur = rankOf(g.ab);
  return Math.round(g.ab - before);
}
async function wrong(wk, wa) {   // wk＝原因代碼（why_*），wa＝要擋的點

  g.wrong++;
  const d = updateAbility(false);
  const x = { b: p.black.join(' '), w: p.white.join(' '), a: p.atkWhite ? 'w' : 'b', id: p.id, r: p.rank, L: p.L, s: p.score, e: d, ok: 0, sec: +g.psec.toFixed(1), wk, wa: wa || '', m: g.moves.join(' '), wf: g.wf, wn: g.wn };
  g.log.push(x);
  renderHud();
  await flash(whyText(x) + (g.wrong >= MAX_WRONG ? '' : '<br>' + T('leftN', { n: MAX_WRONG - g.wrong })), 'bad', FEED_MS);
  if (g.wrong >= MAX_WRONG) endGame(T('endWrong', { n: MAX_WRONG }));

// ---------- 結算＋排行榜 ----------
let lastRun = null, myId = null;
function endGame(why) {
  if (g.over) return;
  g.over = true; g.hold = true;
  // 結算段位（2026-11-07 使用者：沒證明過的段位不能算）＝能力分的段位、這局解開過的最高題目段位，兩者取低；一題都沒解開＝不判段位
  const proven = g.log.filter(x => x.ok).reduce((m, x) => Math.max(m, x.r), -1);
  const noRank = proven < 0, capped = !noRank && proven < g.cur;
  const finalRank = noRank ? 0 : Math.min(g.cur, proven), demoted = noRank || finalRank < g.start;   // 低於起始段位不入榜
  const pps = g.elapsed > 0 ? g.total / g.elapsed : 0;
  lastRun = { nick: g.nick, startRank: g.start, finalRank, ab: Math.round(g.ab * 10) / 10, total: Math.round(g.total * 10) / 10, pps: Math.round(pps * 100) / 100,
    solved: g.solved, wrong: g.wrong, seconds: Math.round(g.elapsed * 10) / 10, demoted, detail: g.log };
  $('endWhy').textContent = why;
  $('endRank').textContent = noRank ? '—' : rankName(finalRank);
  $('endRank').style.fontSize = !noRank && rankName(finalRank).length > 4 ? '30px' : '';
  $('endNote').textContent = noRank ? T('noteNone') : demoted ? T('noteDown', { r: rankName(finalRank) }) : finalRank > g.start ? T('noteUp') : T('noteKeep', { r: rankName(finalRank) });
  $('stamp').classList.toggle('down', demoted);
  $('eAb').textContent = Math.round(g.ab);
  $('eSolved').textContent = g.solved;
  const top = finalRank < TOP_RANK ? LOW[finalRank + 1] : null;
  $('ePts').textContent = noRank ? T('noRankLine') : capped ? T('capLine', { a: Math.round(g.ab), r: rankName(g.cur), p: rankName(proven) })
    : T('abLine', { a: Math.round(g.ab), r: rankName(finalRank), lo: LOW[finalRank], hi: top ?? '∞', next: top ? T('abNext', { top, r: rankName(finalRank + 1) }) : '' });
  show('sEnd');
  submit();
}

      d.className = 'row' + (x.id === myId ? ' me' : '');
      const val = Math.round(x.ab);
      d.innerHTML = `<span class="no">${i + 1}</span><span class="nm"></span><span class="rk">${rankName(x.final_rank) || ''}</span><span class="vl">${val}</span>`;
      d.querySelector('.nm').textContent = x.nick;
      rows.appendChild(d);
    });
  }).catch(() => { rows.innerHTML = `<span class="muted" style="padding:12px 6px">${T('boardFail')}</span>`; });
}

function openModal(id) { $(id).hidden = false; $(id).querySelector('[data-close]').focus(); }
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', (e) => { if (e.target === m || e.target.closest('[data-close]')) m.hidden = true; });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal').forEach(m => m.hidden = true); });
$('openBoard').onclick = $('endBoardBtn').onclick = () => { boardView($('startBoard')); openModal('mBoard'); };
function reportForm(row, x) {   // 回報這題有問題（2026-11-07）：選原因＋幾句話 → Worker /report；後台看得到、可停用
  if (row.nextElementSibling && row.nextElementSibling.classList.contains('rform')) { row.nextElementSibling.remove(); return; }
  const f = document.createElement('div'); f.className = 'rform';
  f.innerHTML = `<b>${T('reportT', { id: x.id || '' })}</b>
    <div class="kinds">${['answer', 'unfair', 'other'].map((k, i) => `<label><input type="radio" name="rk" value="${k}"${i ? '' : ' checked'}> ${T('rk_' + k)}</label>`).join('')}</div>
    <textarea maxlength="300" rows="2" placeholder="${T('reportPh')}"></textarea>
    <div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn gold" style="height:44px;flex:1;font-size:16px">${T('reportSend')}</button><span class="muted msg" role="status" style="font-size:13px"></span></div>`;
  f.querySelector('button').onclick = async () => {
    const btn = f.querySelector('button'); btn.disabled = true;
    try {
      const r = await fetch(API + '/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pid: x.id, b: x.b, w: x.w, a: x.a, kind: f.querySelector('input:checked').value, text: f.querySelector('textarea').value, run: myId }) });
      if (!r.ok) throw new Error(r.status);
      f.querySelector('.msg').textContent = T('reportOk'); row.querySelector('.rpt').disabled = true;
    } catch { f.querySelector('.msg').textContent = T('reportFail'); btn.disabled = false; }
  };
  row.after(f);
}
$('openReview').onclick = () => {
  const list = $('revList'); list.innerHTML = '';
  if (!lastRun || !lastRun.detail.length) list.innerHTML = `<span class="muted">${T('noPuzzles')}</span>`;
  for (const x of (lastRun ? lastRun.detail : [])) {
    const d = document.createElement('div'); d.className = 'rev';
    const href = `score.html#b=${x.b.split(' ').join(',')}&w=${x.w.split(' ').join(',')}`;
    d.innerHTML = `<span class="tag ${x.ok ? 'ok' : 'ng'}">${x.ok ? T('tagOk') : T('tagNg')}</span><span class="tx"><span class="info"></span><span class="pid"></span></span><a target="_blank" rel="noopener">${T('open')}</a><button type="button" class="rpt">${T('report')}</button>`;
    d.querySelector('.info').textContent = [rankName(x.r), x.a === 'w' ? T('white') : T('black'), T('moves', { n: x.L }), T('secs', { s: x.sec }), T('pscore', { s: x.s }), ...(x.ok ? [] : [whyText(x)]), T('abDelta', { d: (x.e > 0 ? '+' : '') + x.e })].join(T('sep'));
    d.querySelector('a').href = href;
    (x.id ? Promise.resolve(x.id) : puzzleId(x.b, x.w, x.a)).then(id => { x.id = id; d.querySelector('.pid').textContent = '#' + id; });
    d.querySelector('.rpt').onclick = () => reportForm(d, x);
    list.appendChild(d);
  }
  openModal('mReview');
};
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
