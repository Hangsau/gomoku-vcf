<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F121A">
<title>Gomoku Rush — 兩儀殿</title>
<link rel="icon" type="image/png" sizes="192x192" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* 對戰大廳（2026-11-11）：配色、字型、按鈕、棋盤照 game.html（Gomoku Rush）；規則 game/duel/match.js（連珠）；伺服器 game/duel-server/worker.js */
:root {
  --bg: #0F121A; --panel: #161A24; --panel2: #1F2A3D; --line: #252B3A; --line2: #2E3546;
  --text: #EDEFF5; --text2: #B6BCCB; --gold: #F2B544; --goldBg: #3A2F17; --goldInk: #1A1300;
  --teal: #3CC6B4; --tealBg: #1F3B39; --tealInk: #06231F; --fail: #FF7A6B; --failBg: #3D1F1F;
  --num: 'Chakra Petch', 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; }
html, body { touch-action: manipulation; margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; -webkit-text-size-adjust: 100%; }
:lang(ja) body, body:lang(ja) { font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif; }
:lang(ko) body, body:lang(ko) { font-family: 'Noto Sans KR', 'Noto Sans TC', sans-serif; word-break: keep-all; }
button, a, input { touch-action: manipulation; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none; }
.pad { padding-left: 16px; padding-right: 16px; }
.muted { color: var(--text2); }
.topbar { position: relative; display: flex; justify-content: space-between; align-items: center; padding: calc(6px + env(safe-area-inset-top)) 8px 0; }
.topbar > div { display: flex; }
.icob { width: 48px; height: 48px; border: 0; border-radius: 14px; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.langs { position: absolute; right: 8px; top: calc(56px + env(safe-area-inset-top)); z-index: 5; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.langs[hidden] { display: none; }
.langs button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: var(--text); font-size: 16px; text-align: left; }
.langs button[aria-pressed="true"] { color: var(--gold); font-weight: 700; }
.btn { height: 56px; border-radius: 18px; border: 0; font-size: 19px; font-weight: 900; }
.btn.gold { background: var(--gold); color: var(--goldInk); }
.btn.ghost { background: transparent; border: 1px solid var(--line2); color: var(--text); font-size: 16px; font-weight: 500; }
.thumb { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
.chips { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 8px; }
.chips button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font-size: 15px; padding: 2px 4px; line-height: 1.2; }
.chips button[aria-pressed="true"] { border: 2px solid var(--teal); background: var(--tealBg); font-weight: 700; }
input.nick { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font: inherit; font-size: 16px; padding: 0 12px; }

/* 等待中的小燈：慢慢呼吸，讓人感覺房裡有人在等 */
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); display: inline-block; flex: none; box-shadow: 0 0 0 0 rgba(242,181,68,.6); animation: breathe 1.8s ease-out infinite; }
.dot.teal { background: var(--teal); animation: none; }
.dot.off { background: var(--text2); animation: none; opacity: .5; }
@keyframes breathe { 0% { box-shadow: 0 0 0 0 rgba(242,181,68,.55); } 70% { box-shadow: 0 0 0 8px rgba(242,181,68,0); } 100% { box-shadow: 0 0 0 0 rgba(242,181,68,0); } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

/* 大廳 */
.me { display: flex; gap: 8px; align-items: center; padding-top: 8px; }
.net { font-size: 13px; display: flex; align-items: center; gap: 6px; padding: 8px 16px 4px; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 16px 4px; display: flex; flex-direction: column; gap: 10px; }
.roomc { width: 100%; text-align: left; border-radius: 18px; border: 2px solid var(--line2); background: var(--panel); color: var(--text); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.roomc.wait { border-color: var(--gold); }
.roomc .hd { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text2); }
.roomc .hd b { font-family: var(--num); font-size: 18px; color: var(--text); }
.roomc .hd .tag { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap; }
.roomc .ex { font-size: 13px; color: var(--text2); line-height: 1.4; }   /* 規則、時間另起一行，窄螢幕才不會把房號擠成直排 */
.roomc.wait .tag { color: var(--gold); }
.roomc.play .tag { color: var(--teal); }
.roomc .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px; border-radius: 12px; background: var(--bg); font-size: 15px; }
.seat .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.empty { border: 1.5px dashed var(--line2); background: transparent; color: var(--text2); }
.st { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block; }
.st.b { background: #1B1A17; border: 1.5px solid #8A90A0; }   /* 深色底上黑子要有亮邊才看得到 */
.st.w { background: #FBFAF6; }
.st.q { background: linear-gradient(90deg, #1B1A17 50%, #FBFAF6 50%); border: 1.5px solid #8A90A0; }   /* 塔拉、Swap2 開局前還不知道誰黑誰白 */
.st.p { background: transparent; border: 2px solid var(--gold); }   /* VCF 搶答：沒有黑白，座位用空心圈 */
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); display: inline-block; }
.pips i.on { background: var(--gold); }
.vst { font-weight: 500; font-size: 13px; color: var(--text2); }
.vst.armed { color: var(--gold); }
.vst.out { color: var(--fail); }
.vst.solved { color: var(--teal); font-weight: 700; }
.vsc { font-family: var(--num); font-size: 17px; color: var(--gold); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 48px; height: 44px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font-size: 24px; }
.stepper .val { flex: 1; height: 44px; border-radius: 12px; background: var(--goldBg); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--gold); font-weight: 700; font-size: 18px; }
.kopt[hidden] { display: none; }
.ctime { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text2); }
.ctime[hidden] { display: none; }
.ctime input { width: 64px; height: 40px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg); color: var(--text); font: inherit; font-size: 16px; text-align: center; }
.ctime b { color: var(--text); }
.kopt { display: flex; flex-direction: column; gap: 10px; }
.phase { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 0; }
.phase[hidden] { display: none; }
.phase .btn { flex: 1 1 30%; height: 48px; font-size: 15px; padding: 0 4px; line-height: 1.15; }
.phase .btn.rva { flex: 0 0 44px; }
.phase .btn.rvt { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-hall { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; }
.empty-hall svg { width: 64px; height: 64px; fill: none; stroke: var(--line2); stroke-width: 1.5; }

/* 房間 */
.pbar { margin: 0 12px; padding: 6px 12px; min-height: 52px; border-radius: 16px; border: 2px solid transparent; background: var(--panel); display: flex; align-items: center; gap: 10px; }
.pbar.on { border-color: var(--gold); background: var(--goldBg); }
.pbar.empty { border: 2px dashed var(--line2); background: transparent; }
.pbar .st { width: 22px; height: 22px; }
.pbar .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; padding-left: 2px; }   /* 不切 overflow：等待燈的光圈才不會被切掉，名字本身另外省略 */
.pbar .nm small { font-weight: 400; color: var(--text2); font-size: 13px; }
.pbar .ck { font-family: var(--num); font-size: 26px; font-weight: 700; }
.pbar .ck.low { color: var(--fail); }
.pbar .sit { height: 40px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--gold); color: var(--goldInk); font-size: 16px; font-weight: 900; }
.rhead { display: flex; align-items: center; gap: 8px; padding: calc(4px + env(safe-area-inset-top)) 8px 4px; }
.rhead .ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rhead .ttl b { font-family: var(--num); font-size: 18px; }
.rhead .ttl span { font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { padding: 4px 16px; min-height: 28px; font-size: 15px; color: var(--text2); text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
.boardWrap { position: relative; align-self: center; touch-action: manipulation; margin: 4px 0; }
canvas#board { display: block; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.flash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.flash[hidden] { display: none; }
.flash span { padding: 12px 24px; border-radius: 20px; font-size: 22px; font-weight: 900; background: rgba(15,18,26,.9); display: inline-flex; flex-direction: column; gap: 4px; text-align: center; max-width: 92%; }
.flash.warn span { color: var(--gold); border: 2px solid var(--gold); }
.flash.bad span { color: var(--fail); border: 2px solid var(--fail); }
.flash.info span { color: var(--text); border: 2px solid var(--line2); font-size: 18px; }
.flash span small { font-size: 15px; font-weight: 500; color: var(--text2); }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; padding: 2px 16px 0; font-size: 13px; color: var(--text2); }

/* 浮層 */
.modal { position: fixed; inset: 0; background: rgba(5,7,12,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.modal[hidden] { display: none; }
.modal .box { width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto; border-radius: 24px 24px 0 0; background: var(--panel); padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.modal h2 { margin: 0; font-size: 20px; }
.modal .lbl { font-size: 14px; color: var(--text2); margin-top: 4px; }
@media (max-height: 720px) {   /* 開房表單多了「類型」一排（2026-11-11），矮螢幕收緊間距，不要在表單裡捲動 */
  .modal .box { gap: 4px; padding-top: 6px; }
  .modal .lbl { margin-top: 0; font-size: 13px; }
  .modal .chips button { min-height: 38px; }
  .ctime input { height: 36px; }
  #mCreate .icob { height: 40px; }
  #doCreate { height: 52px !important; margin-top: 4px !important; }
  #ruleNote { min-height: 0 !important; }
  .stepper button, .stepper .val { height: 40px; }
}
@media (max-height: 680px) {   /* 小手機（360×640、375×667）：英日文規則說明會換兩三行，再收一點 */
  .modal h2 { font-size: 18px; }
  .modal .chips button { min-height: 36px; }
  #ruleNote, #vOpts > .muted { font-size: 12px !important; line-height: 1.3 !important; }
  .modal .box { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
}
.stamp { align-self: center; width: 124px; height: 124px; flex: none; border-radius: 50%; border: 7px double var(--gold); color: var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg); text-align: center; }
.stamp.lose { border-color: var(--fail); color: var(--fail); }
.stamp.even { border-color: var(--teal); color: var(--teal); }
.stamp b { font-size: 28px; font-weight: 900; line-height: 1.1; }
.row2 { display: flex; gap: 10px; }
.row2 .btn { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel2); color: var(--text); padding: 10px 18px; border-radius: 12px; font-size: 15px; z-index: 20; pointer-events: none; }
</style>
</head>
<body>
<div class="app">

<!-- 大廳 -->
<section id="sLobby" class="screen">
  <div class="topbar">
    <a href="game.html#pick" class="icob" aria-label="回挑戰" data-i18n-aria="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <b style="font-size: 18px;" data-i18n="title">兩儀殿</b>
    <div>
      <button type="button" class="icob" data-sound aria-pressed="true"></button>
      <button type="button" class="icob" id="langBtn" aria-label="Language" aria-haspopup="true" aria-expanded="false" aria-controls="langs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></button>
    </div>
    <div class="langs" id="langs" role="group" aria-label="Language" hidden></div>
  </div>
  <div class="pad me">
    <label for="nick" class="muted" style="font-size: 15px; white-space: nowrap;" data-i18n="nick">暱稱</label>
    <input id="nick" class="nick" maxlength="12" autocomplete="nickname" placeholder="別人看到的名字" data-i18n-ph="nickPh">
  </div>
  <div class="net muted" id="net" role="status"><i class="dot off"></i><span></span></div>
  <div class="list" id="list"></div>
  <div class="thumb"><button type="button" class="btn gold" id="openCreate" style="flex: 1; height: 60px; font-size: 21px;" data-i18n="create">開房</button></div>
</section>

<!-- 房間（看房間資訊、入座、下棋、觀戰都在這裡） -->
<section id="sRoom" class="screen" hidden>
  <div class="rhead">
    <button type="button" class="icob" id="rBack" aria-label="回大廳" data-i18n-aria="toLobby"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b id="rTitle"></b><span id="rSub"></span></div>
    <button type="button" class="icob" data-sound aria-pressed="true"></button>
  </div>
  <div class="pbar" id="pTop"></div>
  <div class="status" id="status" role="status"></div>
  <div class="boardWrap" id="boardWrap">
    <canvas id="board" aria-label="棋盤" data-i18n-aria="boardAria"></canvas>
    <div class="flash" id="flash" hidden></div>
  </div>
  <div class="pbar" id="pBot"></div>
  <div class="facts" id="facts"></div>
  <div class="phase" id="phaseActs" hidden></div>
  <div class="grow" style="flex: 1;"></div>
  <div class="thumb" id="rActs"></div>
</section>
</div>

<!-- 開房 -->
<div class="modal" id="mCreate" hidden role="dialog" aria-modal="true" aria-labelledby="mCreateT">
  <div class="box">
    <div style="display:flex;align-items:center;justify-content:space-between"><h2 id="mCreateT" data-i18n="create">開房</h2><button type="button" class="icob" data-close aria-label="關閉" data-i18n-aria="close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <span class="lbl" data-i18n="kindL">類型</span><div class="chips" id="cKind" style="--n: 2;"></div>
    <div class="kopt" id="gOpts">
    <span class="lbl" data-i18n="ruleL">規則</span><div class="chips" id="cRule"></div>
    <span class="muted" id="ruleNote" style="font-size: 13px; line-height: 1.45; min-height: 38px;"></span>
    <span class="lbl" data-i18n="timeL">時間</span><div class="chips" id="cTime" style="--n: 4;"></div>
    <div class="ctime" id="cTimeX" hidden><input id="cMin" type="number" inputmode="numeric" min="1" max="180"><span data-i18n="cMin">分鐘</span><b>＋</b><input id="cInc" type="number" inputmode="numeric" min="0" max="60"><span data-i18n="cInc">每手加秒</span></div>
    <span class="lbl" data-i18n="sideL">我拿</span><div class="chips" id="cSide"></div>
    </div>
    <div class="kopt" id="vOpts" hidden>
    <span class="muted" style="font-size: 13px; line-height: 1.45;" data-i18n="vNote"></span>
    <span class="lbl" data-i18n="vRankL">題目段位</span>
    <div class="stepper"><button type="button" id="vRkDown" aria-label="−">−</button><div class="val" id="vRkName" aria-live="polite"></div><button type="button" id="vRkUp" aria-label="+">+</button></div>
    <span class="lbl" data-i18n="vThinkL">每題思考時間</span><div class="chips" id="cThink"></div>
    <span class="lbl" data-i18n="vTargetL">先解開幾題獲勝</span><div class="chips" id="cTarget" style="--n: 3;"></div>
    </div>
    <span class="lbl" data-i18n="tapL">落子方式</span><div class="chips" id="cTap" style="--n: 2;"></div>
    <button type="button" class="btn gold" id="doCreate" style="margin-top: 8px; height: 60px;" data-i18n="createGo">開房，等人入座</button>
  </div>
</div>

<!-- 閒置：還在嗎？（2026-11-11） -->
<div class="modal" id="mIdle" hidden role="alertdialog" aria-modal="true" aria-labelledby="idleT" style="z-index: 12;">
  <div class="box" style="align-items: stretch; text-align: center;">
    <h2 id="idleT" data-i18n="idleT">還在嗎？</h2>
    <span class="muted" id="idleSub" style="font-size: 15px;"></span>
    <b id="idleSec" style="font-family: var(--num); font-size: 44px; color: var(--gold);"></b>
    <div class="row2">
      <button type="button" class="btn ghost" id="bIdleLeave" data-i18n="idleLeave">離開</button>
      <button type="button" class="btn gold" id="bIdleStay" data-i18n="idleStay">我還在</button>
    </div>
  </div>
</div>

<!-- 對局結束 -->
<div class="modal" id="mEnd" hidden role="dialog" aria-modal="true" aria-labelledby="endTitle">
  <div class="box" style="align-items: stretch;">
    <div class="stamp" id="stamp"><b id="endTitle"></b></div>
    <span class="muted" id="endWhy" style="font-size: 16px; text-align: center;"></span>
    <span id="endAgain" style="font-size: 14px; text-align: center; color: var(--gold); min-height: 20px;"></span>
    <div class="row2">
      <button type="button" class="btn ghost" id="bEndLobby" data-i18n="toLobby">回大廳</button>
      <button type="button" class="btn gold" id="bAgain" data-i18n="again">再來一局</button>
    </div>
    <div class="row2">
      <button type="button" class="btn ghost" id="bReview" style="height: 48px;" data-i18n="review">研棋</button>
      <button type="button" class="btn ghost" id="bLook" style="height: 48px; border: 0; color: var(--text2);" data-i18n="look">看棋盤</button>
    </div>
  </div>
</div>

<script type="module">
import { BLACK, WHITE, EMPTY, SIZE, FORBID_NONE, forbidType } from './game/duel/rules.js';
import { RULE, PHASE, ACTION, OFFER_COUNT, SWAP2_ADD_CHOICE, END_REASON, replayMatch, actorOf, colorOf, canChooseYamaguchi, openingZoneRadius, placeError, stoneColorToPlace, ruleHasForbidden } from './game/duel/match.js';
const PLACE_PHASES = [PHASE.PLAY, PHASE.OPENING_PLACE, PHASE.SWAP2_PLACE, PHASE.SWAP2_ADD];
const SWAP_RULES = [RULE.TARA, RULE.TARA10, RULE.SWAP2];   // 開局才決定誰黑誰白

const WS_LOCAL = 'ws://127.0.0.1:8787/ws';
const WS_PROD = 'wss://rush-duel.psyhangsau.workers.dev/ws';   // 2026-11-11 上線（npx wrangler@4.158.0 deploy -c game/duel-server/wrangler.toml）

const rvOrder = () => (mySeat() === 1 ? [1, 0] : [0, 1]);   // 座位順序：我的放前面
function rvWho(seat) {   // 玩家看到「我的／對手」，觀戰的人看到暱稱
  const me = mySeat();
  if (me < 0) return room.seats[seat]?.nick || '?';
  return T(seat === me ? 'rvMine' : 'rvOpp');
}
function rvFacts() {
  const rv = room.vs.review, k = RV.k;
  const parts = [T('rvK', { k: k + 1, n: rv.list.length }), ...rvOrder().map((seat) => `${rvWho(seat)}：${rvResult(seat, k)}`)];
  if (RV.who === 'sol' && RV.sol.get(k) === null) parts.push(T('rvNoSol'));
  return parts.map(x => `<span>${esc(x)}</span>`).join('');
}
function rvBar() {   // 一行：◀ ▶ ＋ 正解／我的／對手（小手機也不能捲動）
  const el = $('phaseActs');
  if (!rvIsOn()) { el.hidden = true; el.innerHTML = ''; return; }
  const n = room.vs.review.list.length;
  const arrow = (id, ch, lab, off) => `<button type="button" class="btn ghost rva" data-rv="${id}" aria-label="${esc(T(lab))}"${off ? ' disabled' : ''}>${ch}</button>`;
  const tab = (id, label) => `<button type="button" class="btn ${String(RV.who) === id ? 'gold' : 'ghost'} rvt" data-rv="${id}">${esc(label)}</button>`;
  el.hidden = false;
  el.innerHTML = arrow('prev', '◀', 'rvPrev', RV.k <= 0) + arrow('next', '▶', 'rvNext', RV.k >= n - 1)
    + tab('sol', T('rvSol')) + rvOrder().map((seat) => tab(String(seat), rvWho(seat))).join('');
  el.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => {
    const a = b.dataset.rv;
    if (a === 'prev') RV.k = Math.max(0, RV.k - 1);
    else if (a === 'next') RV.k = Math.min(n - 1, RV.k + 1);
    else RV.who = a === 'sol' ? 'sol' : Number(a);
    renderRoom();
  });
}
function rvSolution(k) {   // 有人解開就用他的手順；都沒解開就用引擎算一次
  if (RV.sol.has(k)) return RV.sol.get(k);
  for (const L of room.vs.review.logs) if (L[k] && L[k].r === 'solved' && L[k].seq.length) { RV.sol.set(k, L[k].seq); return L[k].seq; }
  RV.sol.set(k, undefined);   // 計算中
  const p = vPuzzle(room.vs.review.list[k]), want = RV;
  vSolve(p.black.join(' '), p.white.join(' '), p.atkWhite).then((r) => {
    const sol = r && r.result && r.result.solution ? String(r.result.solution).replace(/\(.*\)/, '').trim().split(/\s+/).filter(Boolean) : [];
    if (RV === want) { RV.sol.set(k, sol.length ? sol : null); renderRoom(); }
  }).catch(() => { if (RV === want) { RV.sol.set(k, null); renderRoom(); } });
  return undefined;
}
function vcfRenderEnd() {
  const me = mySeat(), res = room.vs && room.vs.result;
  if (!res || me < 0) return;
  let title, cls = '';
  if (res.winner === null) { title = T('draw'); cls = 'even'; }
  else if (res.winner === me) title = T('win');
  else { title = T('lose'); cls = 'lose'; }
  $('endTitle').textContent = title;
  $('stamp').className = 'stamp ' + cls;
  const sc = room.vs.score, loser = res.winner === null ? '' : room.seats[1 - res.winner]?.nick || '';
  $('endWhy').textContent = res.note === 'nobank' ? T('vNoBank') : res.note === 'resign' ? T('whyResign', { c: loser }) : res.note === 'disconnect' ? T('whyLeft', { c: loser }) : res.note === 'idle' ? T('whyIdle', { c: loser }) : T('vEndScore', { a: sc[me], b: sc[1 - me] });
  const other = room.seats[1 - me];
  const iWant = room.again.includes(myId), theyWant = other && room.again.includes(other.id);
  $('endAgain').textContent = !other ? '' : iWant ? T('againWait') : theyWant ? T('againOther').replace(/[（(].*[）)]/, '') : '';
  $('bAgain').disabled = !other || iWant;
  $('bReview').hidden = true;
  $('bLook').textContent = T(room.vs.review && room.vs.review.list.length ? 'rvBtn' : 'look');
}
function numbered(seq, atkWhite) {   // 解法手順：攻方、守方交替，標數字（跟 Rush 研究盤一樣）
  seq.forEach((t, k) => {
    const p = tToP(t), blk = (k % 2 === 0) !== atkWhite, [x, y] = xyOf(p);
    stone(p, blk);
    ctx.fillStyle = blk ? '#F2B544' : '#1B1A17';
    ctx.font = `700 ${Math.round(cell * 0.48)}px 'Chakra Petch', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(k + 1), x, y + 1);
  });
}
function vcfDraw() {
  if (room.state === 'wait') return;
  if (rvIsOn()) {
    const rv = room.vs.review, x = rv.list[RV.k];
    if (!x) return;
    const p = vPuzzle(x);
    for (const t of p.black) stone(tToP(t), true);
    for (const t of p.white) stone(tToP(t), false);
    const seq = RV.who === 'sol' ? rvSolution(RV.k) : rv.logs[RV.who][RV.k]?.seq;
    if (seq) numbered(seq, p.atkWhite);
    return;
  }
  const st = vSt(vView());
  if (!VR || !st || vIsCounting(st)) return;   // 倒數中不給看題目，兩人同時看到
  const p = VR.p, mine = mySeat() >= 0;
  for (const t of mine ? VR.black : p.black) stone(tToP(t), true);
  for (const t of mine ? VR.white : p.white) stone(tToP(t), false);
  if (mine && VR.lastDef) { const [x, y] = xyOf(tToP(VR.lastDef)); ctx.fillStyle = '#FF7A6B'; ctx.beginPath(); ctx.arc(x, y, cell * 0.12, 0, Math.PI * 2); ctx.fill(); }
  if (ghost != null) {
    stone(ghost, !p.atkWhite, 0.55);
    const [x, y] = xyOf(ghost); ctx.lineWidth = 3; ctx.strokeStyle = '#3CC6B4';
    ctx.beginPath(); ctx.arc(x, y, cell * 0.7, 0, Math.PI * 2); ctx.stroke();
  }
}
function vOut(why) {
  if (!VR || VR.out || VR.done) return;
  VR.out = why; VR.hold = true; ghost = null;
  send({ t: why === 'skip' ? 'vskip' : 'vout', n: VR.i, why, seq: VR.seq });
  flash(T('vWhy_' + why), '', 'bad', 1200);
  renderRoom();
}
const vCanSkip = () => room && room.kind === 'vcf' && room.state === 'play' && mySeat() >= 0 && VR && !VR.out && !VR.done && vIsLive(vSt(mySeat()));
async function vcfClick(ev) {
  const st = vSt(mySeat());
  if (room.state !== 'play' || mySeat() < 0 || !vIsLive(st) || !VR || VR.i !== st.i || VR.hold || VR.done || VR.out) return;
  const p = cellAt(ev);
  if (p === null) return;
  const t = pToT(p);
  if (VR.black.includes(t) || VR.white.includes(t)) return;
  if (cfg.tap === '2' && ghost !== p) { ghost = p; renderRoom(); return; }
  ghost = null;
  const round = VR, puz = round.p, atk = puz.atkWhite ? round.white : round.black, def = puz.atkWhite ? round.black : round.white;
  round.hold = true;
  const res = (await vMove(round.black.join(' '), round.white.join(' '), t, puz.atkWhite)).result || { r: 'illegal' };
  if (VR !== round || round.out || round.done) return;   // 等引擎時這題已經結束
  if (res.r === 'illegal') { round.hold = false; return; }
  if (res.r === 'forbidden' || res.r === 'notfour') { round.hold = false; flash(T(res.r), T('noMiss'), 'warn', 900); renderRoom(); return; }
  if (res.r === 'forcedForbidden') return vOut('forbid');
  atk.push(t); round.seq.push(t); round.moves.push(t); stoneSound();
  if (res.r === 'win') { round.done = true; send({ t: 'vdone', n: round.i, seq: round.seq }); chime(); flash(T('vSolvedS'), '', 'info', 1000); renderRoom(); return; }
  if (res.r === 'defFive') { def.push(res.at); round.seq.push(res.at); round.lastDef = res.at; renderRoom(); return vOut('five'); }
  if (res.r === 'block') {
    def.push(res.def); round.seq.push(res.def); round.lastDef = res.def; setTimeout(() => stoneSound(true), 160);
    if (res.nofour) { renderRoom(); return vOut(res.forcedForbidden ? 'forbid' : 'nofour'); }
    if (!round.armed) { round.armed = true; round.left = MJ_START; } else round.left += MJ_STEP;   // 明鏡台：第一手開錶，之後每手 +1 秒
    send({ t: 'vprog', n: round.i, moves: round.moves.length, armed: true });
    round.hold = false; renderRoom();
    return;
  }
  vOut('bad');
}
function beep(last) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), gn = a.createGain();
  o.type = 'sine'; o.frequency.value = last ? 1320 : 880;
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.35, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + (last ? 0.35 : 0.12));
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t + (last ? 0.4 : 0.15));
}
if (WS_URL === WS_LOCAL) window.__duel = { vSolve, get VR() { return VR; }, get RV() { return RV; }, get room() { return room; } };   // 只有本機：給自動測試取正解
// 每 100ms：明鏡台落子計時、開局倒數、思考剩餘時間
let vLastTick = performance.now(), vLastCount = null;
setInterval(() => {
  const now = performance.now(), dt = (now - vLastTick) / 1000; vLastTick = now;
  if (!room || room.kind !== 'vcf' || $('sRoom').hidden || room.state !== 'play') return;
  const st = vSt(vView());
  if (!st || !st.puzzle) return;
  if (vIsCounting(st)) {   // 開局倒數 3、2、1
    const k = Math.ceil((st.at - srvNow()) / 1000);
    if (k !== vLastCount) { vLastCount = k; flash(String(k), T(st.puzzle[4] === 'w' ? 'vAtkW' : 'vAtkB'), 'info', 950); if (k <= 3) beep(false); }
  } else if (vLastCount !== null) { vLastCount = null; beep(true); renderRoom(); }   // 倒數結束：整個重畫（題目、黑先／白先那行）
  if (VR && VR.armed && !VR.done && !VR.out && !VR.hold && vIsLive(st)) {
    const before = Math.ceil(VR.left);
    VR.left -= dt;
    const after = Math.ceil(VR.left);
    if (after !== before && after >= 1 && after <= 3) beep(after === 1);
    if (VR.left <= 0) { VR.left = 0; vOut('time'); return; }
  }
  $('status').innerHTML = vcfStatus();
  vcfBar($('pTop'), 1 - vView()); vcfBar($('pBot'), vView());
  const sk = $('aSkip'); if (sk) sk.disabled = !vCanSkip();
}, VCF_TICK_MS);

applyLang();
layout();
connect();
</script>
