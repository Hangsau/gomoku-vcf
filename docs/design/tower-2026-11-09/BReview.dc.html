<div style="width: 375px; height: 667px; box-sizing: border-box; background: #0F121A; color: #EDEFF5; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 8px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 22px; font-weight: 900; color: #FF7A6B">第 23 層沒過</span>

    <button type="button" aria-pressed="true" style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: #1F3B39; color: #3CC6B4; font-size: 15px; font-weight: 700">正確答案</button>
  </div>
  <div style="display: flex; justify-content: center">
    <dc-import name="Goban" size="{{343}}" set="answer" hint-size="343px,343px"></dc-import>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 0 0">

    <button type="button" aria-label="上一手" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: #161A24; color: #EDEFF5; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <span style="min-width: 64px; text-align: center; font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700">7 / 7</span>
    <button type="button" aria-label="下一手" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: #161A24; color: #EDEFF5; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
    <button type="button" aria-label="自動播放" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: #161A24; color: #EDEFF5; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z"></path></svg></button>
  </div>
  <div style="flex: 1"></div>
  <div style="padding: 0 16px 20px">
    <button type="button" style="width: 100%; height: 60px; border-radius: 18px; border: 0; background: #F2B544; color: #1A1300; font-size: 20px; font-weight: 900">往上爬・第 24 層</button>
  </div>
</div>
