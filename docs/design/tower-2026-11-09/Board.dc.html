<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>象牙塔榜</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;background:#0F121A}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 375px; height: 667px; box-sizing: border-box; background: #0F121A; color: #EDEFF5; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 0 20px">
    <h2 style="margin: 0; font-size: 22px; font-weight: 900">象牙塔榜</h2>
    <button type="button" aria-label="關閉" style="width: 48px; height: 48px; border: 0; background: transparent; color: #EDEFF5; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
  <div style="display: flex; gap: 8px; padding: 6px 20px 10px">
    <button type="button" aria-pressed="true" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: #F2B544; color: #1A1300; font-size: 15px; font-weight: 700">今天</button>
    <button type="button" aria-pressed="false" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid #2E3546; background: transparent; color: #EDEFF5; font-size: 15px">昨天</button>
  </div>
  <div style="display: grid; grid-template-columns: 36px 1fr 72px 52px 56px; gap: 4px; padding: 0 20px 6px; font-size: 12px; color: #B6BCCB">
    <span>名次</span><span>暱稱</span><span style="text-align: right">分數</span><span style="text-align: right">正確率</span><span style="text-align: right">時間</span>
  </div>
  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="display: grid; grid-template-columns: 36px 1fr 72px 52px 56px; gap: 4px; align-items: center; padding: 0 20px; height: 44px; border-top: 1px solid #1F2433; font-size: 15px">
        <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: {{r.rc}}">{{r.rank}}</span>
        <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{r.nick}}</span>
        <span style="text-align: right; font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: #F2B544">{{r.score}}</span>
        <span style="text-align: right; color: #B6BCCB">{{r.acc}}</span>
        <span style="text-align: right; color: #B6BCCB">{{r.time}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: grid; grid-template-columns: 36px 1fr 72px 52px 56px; gap: 4px; align-items: center; margin: 0 12px 20px; padding: 0 8px; height: 52px; border-radius: 14px; background: #3A2F17; border: 1px solid #F2B544; font-size: 15px">
    <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: #F2B544">12</span>
    <span style="font-weight: 700">小棋（你）</span>
    <span style="text-align: right; font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: #F2B544">812.4</span>
    <span style="text-align: right; color: #EDEFF5">86%</span>
    <span style="text-align: right; color: #EDEFF5">6:41</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [['棋聖阿明', 2841.7, '91%', '48:12'], ['五連', 2210.3, '88%', '35:40'], ['Hana', 1987.0, '93%', '29:05'], ['衝四王', 1650.5, '80%', '41:22'], ['kuro', 1402.8, '85%', '22:16'], ['小白', 1311.9, '79%', '25:47'], ['陳老師', 1120.4, '90%', '18:33'], ['Mint', 1004.6, '83%', '16:09'], ['阿德', 955.2, '76%', '19:58'], ['Yuki', 901.1, '88%', '12:40']];
    return { rows: raw.map((x, i) => ({ rank: i + 1, nick: x[0], score: x[1].toFixed(1), acc: x[2], time: x[3], rc: i < 3 ? '#F2B544' : '#B6BCCB' })) };
  }
}
</script>
</body>
</html>
