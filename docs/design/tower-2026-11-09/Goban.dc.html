<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>棋盤元件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div role="img" aria-label="題目棋盤" style="position: relative; width: {{size}}px; height: {{size}}px; border-radius: 6px; background-color: #D9B57A; background-image: linear-gradient(#6B4E1F 1px, transparent 1px), linear-gradient(90deg, #6B4E1F 1px, transparent 1px); background-size: {{cell}}px {{cell}}px; background-position: {{off}}px {{off}}px; opacity: {{dim}}">
  <sc-for list="{{stones}}" as="s" hint-placeholder-count="10">
    <div style="{{s.style}}">{{s.num}}</div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":343},"set":{"editor":"enum","options":["play","mine","answer"],"default":"play"},"dim":{"editor":"float","default":1},"hint":{"editor":"boolean","default":false},"$preview":{"width":343,"height":343}}'>
class Component extends DCLogic {
  renderVals() {
    const size = this.props.size ?? 343;
    const cell = size / 15.6, off = cell * 0.8;
    const set = this.props.set ?? 'play';
    const base = [[7,7,'b'],[8,6,'b'],[6,8,'b'],[9,8,'b'],[5,6,'b'],[8,7,'w'],[6,6,'w'],[9,9,'w'],[5,9,'w'],[7,5,'w']];
    const mine = [[7,9,'b',1],[7,10,'w',2],[10,7,'b',3],[11,6,'w',4]];
    const answer = [[8,9,'b',1],[8,10,'w',2],[8,8,'b',3],[8,5,'w',4],[10,10,'b',5],[11,11,'w',6],[10,6,'b',7]];
    const extra = set === 'mine' ? mine : set === 'answer' ? answer : [[7,9,'b',0],[7,10,'w',0]];
    const d = cell * 0.9;
    const st = ([c, r, col, num]) => ({
      num: num ? String(num) : '',
      style: 'position:absolute;display:flex;align-items:center;justify-content:center;font:700 ' + Math.round(d * 0.5) + 'px Chakra Petch,sans-serif;width:' + d + 'px;height:' + d + 'px;border-radius:50%;left:' + (off + c * cell - d / 2) + 'px;top:' + (off + r * cell - d / 2) + 'px;' +
        (col === 'b' ? 'background:#15171C;color:#F2B544;' : 'background:#F4F1EA;color:#1F2A3D;box-shadow:inset 0 0 0 1px #B9B2A3;')
    });
    const stones = base.map(st).concat(extra.map(st));
    if (this.props.hint) stones.push({ num: '', style: 'position:absolute;width:' + d + 'px;height:' + d + 'px;border-radius:50%;border:3px solid #3CC6B4;box-sizing:border-box;left:' + (off + 10 * cell - d / 2) + 'px;top:' + (off + 7 * cell - d / 2) + 'px;' });
    return { size, cell, off, stones, dim: this.props.dim ?? 1 };
  }
}
</script>
</body>
</html>
