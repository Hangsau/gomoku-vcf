<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>B 開始畫面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F121A}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 375px; height: 667px; box-sizing: border-box; background: #0F121A; color: #EDEFF5; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px">
    <button type="button" aria-label="詰題試煉場" style="width: 44px; height: 44px; background: none; border: 0; color: #B6BCCB"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path></svg></button>
    <span style="font-size: 17px; font-weight: 700">Gomoku Rush</span>
    <button type="button" aria-label="排行榜" style="width: 44px; height: 44px; background: none; border: 0; color: #F2B544"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg></button>
  </div>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; border: 1px solid #2E3546; background: #161A24; color: #EDEFF5; text-align: left">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 44px; font-weight: 700; line-height: 1; color: #F2B544; width: 64px">60</span>
      <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 18px">競速</b><span style="font-size: 13px; color: #B6BCCB">答對 +20 秒・錯 3 題結束・上排行</span></span>
    </button>

    <div style="border-radius: 16px; border: 2px solid #3CC6B4; background: #12201F; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 64px; height: 44px; display: flex; align-items: center; color: #3CC6B4"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 18px">練習</b><span style="font-size: 13px; color: #B6BCCB">可悔棋、提示、加時・不上排行</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: #B6BCCB">練習時間</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid #2E3546; background: #161A24; color: #EDEFF5; font-size: 15px">3 分</button>
          <button type="button" aria-pressed="true" style="height: 44px; border-radius: 10px; border: 0; background: #3CC6B4; color: #06231F; font-size: 15px; font-weight: 700">5 分</button>
          <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid #2E3546; background: #161A24; color: #EDEFF5; font-size: 15px">10 分</button>
          <button type="button" style="height: 44px; border-radius: 10px; border: 1px solid #2E3546; background: #161A24; color: #EDEFF5; font-size: 15px">不限</button>
        </div>
      </div>
      <span style="font-size: 13px; color: #B6BCCB">加多少時間在練習中隨時選（+30 秒／+1 分／+2 分）</span>
    </div>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; color: #B6BCCB">起始段位</span>
    <div style="display: flex; align-items: center; height: 52px; border-radius: 12px; background: #161A24; border: 1px solid #252B3A">
      <button type="button" aria-label="降一段" style="width: 56px; height: 52px; border: 0; background: none; color: #EDEFF5; font-size: 24px">−</button>
      <b style="flex: 1; text-align: center; font-size: 19px">三段</b>
      <button type="button" aria-label="升一段" style="width: 56px; height: 52px; border: 0; background: none; color: #EDEFF5; font-size: 24px">+</button>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div style="padding: 12px 16px 20px">
    <button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 14px; background: #3CC6B4; color: #06231F; font-size: 22px; font-weight: 700">開始練習</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
