<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>A 練習中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0F121A}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
.bd{position:relative;width:343px;height:343px;border-radius:6px;background-color:#D9B57A;background-image:linear-gradient(#6B4E1F 1px,transparent 1px),linear-gradient(90deg,#6B4E1F 1px,transparent 1px);background-size:22px 22px;background-position:17px 17px}
</style>
</helmet>
<div style="width: 375px; height: 667px; box-sizing: border-box; background: #0F121A; color: #EDEFF5; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 16px 6px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #B6BCCB">剩餘時間</span>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">4:12</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 13px; color: #B6BCCB">練習段位</span>
      <span style="font-size: 22px; font-weight: 700; color: #3CC6B4">四段</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end">
      <span style="font-size: 13px; color: #B6BCCB">自己解開</span>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 40px; font-weight: 700; line-height: 1; color: #F2B544">3</span>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 8px 0 16px">
    <span style="font-size: 13px; color: #3CC6B4; background: #1F3B39; padding: 4px 10px; border-radius: 999px">練習中・不計排行</span>
    <button type="button" style="height: 44px; padding: 0 12px; border: 0; background: none; color: #B6BCCB; font-size: 15px">結束練習</button>
  </div>
  <div style="display: flex; justify-content: center; padding-top: 4px">
    <div class="bd" role="img" aria-label="題目棋盤">
      <sc-for list="{{stones}}" as="s" hint-placeholder-count="8">
        <div style="{{s.style}}"></div>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; padding: 10px 16px 0; font-size: 15px">
    <span style="font-weight: 700">黑先・VCF</span>
    <span style="color: #B6BCCB">本題 18 秒・<span style="color: #F2B544">用過提示</span></span>
  </div>
  <div style="flex: 1"></div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px 20px">
    <button type="button" style="height: 64px; border-radius: 12px; border: 1px solid #2E3546; background: #161A24; color: #EDEFF5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>悔棋</button>
    <button type="button" style="height: 64px; border-radius: 12px; border: 1px solid #2E3546; background: #161A24; color: #EDEFF5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg>提示</button>
    <button type="button" style="height: 64px; border-radius: 12px; border: 1px solid #3CC6B4; background: #1F3B39; color: #EDEFF5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>+1 分</button>
    <button type="button" style="height: 64px; border-radius: 12px; border: 1px solid #2E3546; background: #161A24; color: #B6BCCB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l8 7-8 7zM17 5v14"></path></svg>跳過</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (c, r, color, extra) => ({ style: 'position:absolute;width:20px;height:20px;border-radius:50%;left:' + (17 + c * 22 - 10) + 'px;top:' + (17 + r * 22 - 10) + 'px;' + (color === 'b' ? 'background:#15171C;' : color === 'w' ? 'background:#F4F1EA;box-shadow:inset 0 0 0 1px #8a7a5a;' : '') + (extra || '') });
    return { stones: [
      st(7, 7, 'b'), st(8, 6, 'b'), st(6, 8, 'b'), st(9, 8, 'b'),
      st(8, 7, 'w'), st(6, 6, 'w'), st(9, 9, 'w'), st(5, 9, 'w'),
      st(7, 9, '', 'border:3px solid #3CC6B4;box-sizing:border-box;background:rgba(60,198,180,.25);')
    ] };
  }
}
</script>
</body>
</html>
