@keyframes dropO{0%{transform:translateY(-46px) scale(1.5,1.5);opacity:0}38%{transform:translateY(-8px) scale(1.12,1.12);opacity:1}55%{transform:translateY(0) scale(1.22,.74)}68%{transform:translateY(-5px) scale(.9,1.12)}80%{transform:translateY(0) scale(1.06,.94)}90%{transform:translateY(-1px) scale(.98,1.02)}100%{transform:none}}

@keyframes beamO{0%{transform:rotate(var(--a)) scaleX(0);opacity:0}30%{opacity:1}100%{transform:rotate(var(--a)) scaleX(1);opacity:1}}
@keyframes quakeO{0%,100%{transform:none}15%{transform:translate(-7px,3px) rotate(-1deg)}30%{transform:translate(6px,-4px) rotate(1deg)}45%{transform:translate(-5px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes flipAO{0%{transform:perspective(900px) rotateY(0)}100%{transform:perspective(900px) rotateY(90deg)}}
@keyframes flipBO{0%{transform:perspective(900px) rotateY(-90deg)}70%{transform:perspective(900px) rotateY(8deg)}100%{transform:perspective(900px) rotateY(0)}}
@keyframes scanO{0%{background-position:0 0}100%{background-position:0 12px}}
@keyframes spinO{0%{transform:rotate(0)}100%{transform:rotate(-360deg)}}
@keyframes msgO{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes headO{0%{transform:scale(1.6);opacity:0;letter-spacing:8px}60%{transform:scale(.95);opacity:1}100%{transform:none;letter-spacing:0}}
@keyframes dotO{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pullO{0%{transform:scale(3.2) translate(-28%,-28%);opacity:.2}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes landO{0%{transform:translateY(-70px) scale(2.2);opacity:0}55%{transform:translateY(0) scale(1.25,.75);opacity:1}72%{transform:translateY(-4px) scale(.92,1.1)}100%{transform:none}}
@keyframes haloO{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}

.dropO{animation:dropO .55s cubic-bezier(.3,.7,.4,1) both}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
// 盤面：題庫 #004Z7T4V（黑先 4 手）照正解走掉第一手後的 3 手題；已用 Gomoku Rush 引擎驗證唯一、逐手重放、兩個成五點都會贏（2026-11-10）
// 9×9 局部，左下角＝G3；解：K8 擋 M10 → H6（四三）擋 G5 → H7（活四）→ 成五 H5／H10
class Component extends DCLogic {
  get D() { return {"B":[[6,0],[1,2],[4,2],[1,3],[4,6],[5,7],[2,4]],"W":[[7,1],[2,2],[3,2],[2,5],[1,7],[6,8],[3,5]],"steps":[{"mv":[3,3],"ok":[[3,3]],"def":[5,1]},{"mv":[1,5],"ok":[[1,5]],"def":[0,6]},{"mv":[1,4],"ok":[[1,4]],"def":null}],"five":[[1,6],[1,1]],"ox":6,"oy":2}; }
  constructor(p) { super(p); this.state = { phase: 'intro', mv: [], thread: null, flash: '', lifting: false, step: 0 }; this.tm = []; }
  componentDidMount() { this.later(1100, () => this.cpuAttack(0)); }
  componentWillUnmount() { this.tm.forEach(clearTimeout); }
  later(ms, f) { this.tm.push(setTimeout(f, ms)); }
  push(c, r, s, extra) { this.setState(st => Object.assign({ mv: st.mv.concat([{ c, r, s }]), flash: '' }, extra || {})); }
  cpuAttack(i) { const [c, r] = this.D.steps[i].mv; this.push(c, r, 'A', { phase: 'd', step: i }); }
  cpuBlock(c, r, extra) {   // 被逼著擋：線從電腦的棋盒拉出來，子沿著線被拖到擋點
    this.setState({ thread: [c, r], tug: true });
    this.later(800, () => this.push(c, r, 'D', Object.assign({ thread: null, tug: false }, extra || {})));
  }
  rewind() {
    this.setState({ phase: 'rw' });
    const step = () => {
      if (!this.state.mv.length) { this.setState({ phase: 'flipA' }); this.later(330, () => this.setState({ phase: 'swap' })); return; }
      this.setState({ lifting: true });
      this.later(240, () => { this.setState(st => ({ mv: st.mv.slice(0, -1), lifting: false })); this.later(90, step); });
    };
    this.later(450, step);
  }
  tap(c, r) {
    const D = this.D, st = this.state, ph = st.phase, i = st.step, is = (p) => p && p[0] === c && p[1] === r;
    const S = D.steps, last = S.length - 1;
    if (ph === 'd') {   // 你防守（白）
      this.push(c, r, 'D', { phase: 'wait' });
      if (i < last) {
        if (is(S[i].def)) this.later(900, () => this.cpuAttack(i + 1));
        else this.later(700, () => { const [x, y] = S[i].def; this.push(x, y, 'A', { phase: 'lost', early: true }); });
      } else {
        const o = is(D.five[0]) ? D.five[1] : D.five[0];
        this.later(800, () => this.push(o[0], o[1], 'A', { phase: 'lost', early: false }));
      }
    } else if (ph === 'a') {   // 你進攻（黑）
      if (i <= last) {
        if (!S[i].ok.some(is)) return this.setState({ flash: ['不是這裡：先衝一個四，就是發光那點。', '不是這裡：這一手要同時做出四和三。', '不是這裡：把三變成兩頭都能成五的活四。'][i] });
        this.push(c, r, 'A', { phase: 'cpu' });
        if (i < last) this.later(550, () => this.cpuBlock(S[i].def[0], S[i].def[1], { phase: 'a', step: i + 1 }));
        else this.later(550, () => this.cpuBlock(D.five[0][0], D.five[0][1], { phase: 'a', step: last + 1 }));
      } else {
        if (!is(D.five[1])) return this.setState({ flash: '活四還有另一頭，連成五！' });
        this.push(c, r, 'A', { phase: 'won' });
      }
    }
  }
  five(all, lastM) {
    const own = new Set(all.filter(m => m.s === lastM.s).map(m => m.c + ',' + m.r));
    for (const [dc, dr] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
      const run = [[lastM.c, lastM.r]];
      for (let k = 1; own.has((lastM.c + dc * k) + ',' + (lastM.r + dr * k)); k++) run.push([lastM.c + dc * k, lastM.r + dr * k]);
      for (let k = 1; own.has((lastM.c - dc * k) + ',' + (lastM.r - dr * k)); k++) run.unshift([lastM.c - dc * k, lastM.r - dr * k]);
      if (run.length >= 5) return run.slice(0, 5);
    }
    return null;
  }
  renderVals() {
    const D = this.D, S = 35, M = 18, st = this.state, ph = st.phase, i = st.step;
    const attack = ['swap', 'a', 'cpu', 'won'].includes(ph);
    const all = D.B.map(([c, r]) => ({ c, r, s: 'A', init: 1 })).concat(D.W.map(([c, r]) => ({ c, r, s: 'D', init: 1 })), st.mv);
    const taken = new Set(all.map(m => m.c + ',' + m.r));
    const lastIdx = all.length - 1, lastM = all[lastIdx];
    const end = ph === 'lost' || ph === 'won';
    const fv = end ? this.five(all, lastM) : null;
    const litMap = {}; if (fv) fv.forEach(([c, r], j) => { litMap[c + ',' + r] = j; });
    const k = ph === 'won' ? 'rgba(242,181,68,.9)' : 'rgba(255,122,107,.9)';
    const stones = all.map((m, j) => {
      const key = m.c + ',' + m.r, isLast = j === lastIdx && !m.init, lit = key in litMap;
      const cls = st.lifting && isLast ? 'liftO' : lit ? 'litO' : isLast ? 'dropO' : '';
      return { x: M + m.c * S - 15, y: M + m.r * S - 15, bg: m.s === 'A' ? '#1B1A17' : '#FBFAF6', cls, new: isLast && !st.lifting && !lit, k, d: lit ? 0.12 * litMap[key] : 0 };
    });
    const Sx = D.steps, last = Sx.length - 1;
    let want = [];
    if (ph === 'd') want = i < last ? [Sx[i].def] : D.five;
    if (ph === 'a') want = i <= last ? Sx[i].ok : [D.five[1]];
    const glows = want.map(([c, r]) => ({ x: M + c * S - 15, y: M + r * S - 15, c: ph === 'd' ? '#FF7A6B' : '#3CC6B4' }));
    const COLS = 'ABCDEFGHJKLMNOP', cells = [];
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      if (taken.has(c + ',' + r)) continue;
      cells.push({ x: M + c * S - 17.5, y: M + r * S - 17.5, label: COLS[D.ox + c] + (D.oy + 1 + 8 - r), pick: () => this.tap(c, r) });
    }
    let beam = null;
    if (fv) {
      const [a, b] = [fv[0], fv[4]], x1 = M + a[0] * S, y1 = M + a[1] * S, x2 = M + b[0] * S, y2 = M + b[1] * S;
      beam = { bx: x1 - 5, by: y1 - 5, bw: Math.hypot(x2 - x1, y2 - y1) + 10, ba: Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI };
    }
    const dText = [['擋住！', '黑衝四了，只差紅圈那一點就連成五。'], ['又來了！', '這一手同時做出四和三。先擋四，不然馬上輸。'], ['兩頭都是洞', '三變成活四了：兩頭都能成五。你只有一手。']];
    const aText = [['先衝一個四', '剛才黑的第一手：做出四，它就只能擋一個地方。'], ['看那條線', '你的四把它的手拉到唯一的擋點。再來：一子同時做出四和三。'], ['它又只能擋四', '現在把三變成兩頭都能成五的活四！'], ['擋不完', '它只擋得了一頭。連成五！']];
    const T = ph === 'intro' ? ['', '你是白棋。黑要攻過來了……'] : ph === 'd' ? dText[i] : ph === 'a' ? aText[i]
      : ({ wait: ['', ''], cpu: ['', '它只能擋那裡……'], rw: ['倒帶', '回到一開始……'], flipA: ['', ''],
        lost: ['你輸了', st.early ? '沒擋到那一點，黑直接連成五。' : '可是回頭看：你每一手都只能擋那裡，根本沒得選。'],
        swap: ['換你了', '換到對面。剛才逼你的那串棋，這次由你來下。'],
        won: ['你贏了', '剛才逼你的，現在換你逼它。這種一路衝四、對手只能跟著擋的贏法，叫 VCF。'] }[ph] || ['', '']);
    const th = st.thread, tx = th ? M + th[0] * S : 0, ty = th ? M + th[1] * S : 0;
    const bad = ph === 'lost', good = ph === 'won';
    const btn = { lost: '倒帶看看', swap: '開始', won: '繼續' }[ph];
    return {
      notZoom: ph !== 'zoom', isZoom: ph === 'zoom', isRw: ph === 'rw', isWait: ph === 'wait' || ph === 'cpu',
      boardCls: ph === 'flipA' ? 'flipAO' : ph === 'swap' ? 'flipBO' : end ? 'quakeO' : '',
      bowlCls: st.tug ? 'tugO' : '',
      role: attack ? '你：黑（進攻）' : '你：白（防守）', meColor: attack ? '#1B1A17' : '#FBFAF6', oppColor: attack ? '#FBFAF6' : '#1B1A17',
      roleBg: attack ? '#1F3B39' : '#3D1F1F', roleInk: attack ? '#3CC6B4' : '#FFB3A8',
      lines: Array.from({ length: 9 }, (_, j) => ({ p: M + j * S + 0.5 })),
      stones, glows, cells,
      hasBeam: !!beam, bx: beam ? beam.bx : 0, by: beam ? beam.by : 0, bw: beam ? beam.bw : 0, ba: beam ? beam.ba : 0,
      beamC: good ? 'rgba(242,181,68,.55)' : 'rgba(255,122,107,.55)',
      hasThread: !!th, threadD: th ? `M 318 -62 Q ${Math.round((318 + tx) / 2 + 50)} ${Math.round((ty - 62) / 2 - 40)} ${tx} ${ty}` : '',
      head: T[0], msg: st.flash || T[1],
      headInk: bad ? '#FF7A6B' : good ? '#F2B544' : attack ? '#3CC6B4' : '#EDEFF5',
      msgBg: bad ? '#2A1716' : good ? '#2A2414' : '#161A24', msgLine: bad ? '#6B2E28' : good ? '#5C4A22' : '#252B3A',
      hasBtn: !!btn, btn: btn || '', btnRw: ph === 'lost',
      act: () => { if (ph === 'lost') this.rewind(); else if (ph === 'swap') this.setState({ phase: 'a', step: 0 }); else if (ph === 'won') this.setState({ phase: 'zoom' }); },
      big: Array.from({ length: 15 }, (_, j) => ({ p: 10 + j * 20 + 0.5 })),
    };
  }
}
</script>
