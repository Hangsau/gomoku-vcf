<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F121A">
<meta name="apple-mobile-web-app-title" content="Rush 後台">
<title>Gomoku Rush 後台</title>
<style>
/* 棋具分頁（2026-11-12）：哪些棋盤、棋子開放給玩家 */
.skq { display: flex; flex-wrap: wrap; gap: 8px; }
.skq button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 14px; }
.skr { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 0; border-top: 1px solid var(--line); }
.skr .pv { flex: none; width: 56px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative; }
.skr .bd { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background-size: cover; background-position: center; }
.skr .dt { position: absolute; width: 28px; height: 28px; border-radius: 50%; background-size: contain; background-repeat: no-repeat; background-position: center; }
.skr .dt.fig { border-radius: 0; background-color: transparent !important; }
.skr .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 15px; }
.skr .nm .new { margin-left: 6px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); }
.skr .nm small { color: var(--text2); font-size: 12px; overflow-wrap: anywhere; }
.skr .sw { flex: none; min-width: 84px; min-height: 44px; border-radius: 22px; border: 1px solid var(--ng); background: transparent; color: var(--ng); font: inherit; font-size: 14px; }
.skr .sw[aria-checked="true"] { border-color: var(--ok); color: var(--ok); }
.skr .fx { flex: none; min-width: 84px; text-align: center; color: var(--text2); font-size: 13px; }
#skMsg { min-height: 20px; font-size: 14px; color: var(--ok); } #skMsg.err { color: var(--ng); }
/* Gomoku Rush 後台（2026-11-08）：玩家留言＋題目回報。只有作者用，前面擋 Cloudflare Access。
   顏色沿用遊戲（game.html）的深色底＋金色重點，讓作者一眼認得是同一個遊戲的東西。
   玩家寫的字一律用 textContent 放進畫面，不當 HTML，避免有人在留言裡塞程式。 */
:root { --bg: #0F121A; --panel: #171B26; --line: #262C3B; --text: #ECEAE4; --text2: #A7ABB8; --gold: #E2B34B; --ok: #6FCF97; --ng: #EB6B6B; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Noto Sans TC", sans-serif; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
header { position: sticky; top: 0; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 0 10px; z-index: 1; }
h1 { margin: 0 0 10px; font-size: 20px; }
.tabs, .filt { display: flex; gap: 8px; flex-wrap: wrap; }
.filt { margin-top: 8px; }
.filt[hidden] { display: none; }
.tabs button, .filt button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text2); font: inherit; }
.filt button { min-height: 36px; font-size: 14px; }
.tabs button[aria-pressed="true"], .filt button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: #1B1A17; font-size: 13px; font-weight: 700; text-align: center; }
.n:empty { display: none; }
main { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card.done { opacity: .55; }
.meta { color: var(--text2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.text { white-space: pre-wrap; word-break: break-word; }
.contact { font-size: 14px; color: var(--gold); word-break: break-all; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.acts button, .acts a { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none; }
.acts .gold { border-color: var(--gold); color: var(--gold); }
.acts .ng { border-color: var(--ng); color: var(--ng); }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 8px; border: 1px solid currentColor; }
.tag.open { color: var(--gold); } .tag.done { color: var(--ok); } .tag.blocked { color: var(--ng); }
.msg { color: var(--text2); padding: 24px 0; text-align: center; }
.sub { font-size: 14px; color: var(--text2); border-left: 2px solid var(--line); padding-left: 8px; }
/* 數據分頁（2026-11-08）：照本機指揮台「遊戲」分頁的算法與段落，手機上表格可以左右滑 */
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.sec h2 { margin: 0; font-size: 17px; }
.note { font-size: 13px; color: var(--text2); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text2); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; font-size: 14px; width: 100%; }
th, td { padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
tbody th { text-align: left; white-space: nowrap; }
thead th { border-top: 0; color: var(--text2); font-size: 12px; font-weight: 400; white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.small { font-size: 12px; color: var(--text2); }
td.r .small { white-space: nowrap; }
.hi { color: var(--ng); } .lo { color: #7fb2ff; } .dim { opacity: .6; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.path { background: var(--bg); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
details.sec summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
/* 題庫分頁（2026-11-11 使用者：依段位、黑白先、手數、盤面子數、題號找題） */
.pzf { display: flex; flex-direction: column; gap: 10px; }
.pzf .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.pzf .row > span:first-child { width: 64px; color: var(--text2); flex: none; }
.pzf .chip { min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text2); font: inherit; font-size: 14px; }
.pzf .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.pzf input, .pzf select { min-height: 36px; width: 70px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 14px; padding: 0 8px; }
.pzf input.id { width: 140px; text-transform: uppercase; } .pzf select { width: auto; }
.pz { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.pz svg { flex: none; border-radius: 6px; background: #E9C98B; }
.pz .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.pz .info b { font-variant-numeric: tabular-nums; }
.pz .acts a, .pz .acts button { min-height: 34px; padding: 0 10px; font-size: 13px; }
.mini { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--ng); background: transparent; color: var(--ng); font: inherit; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Gomoku Rush 後台</h1>
  <div class="tabs" role="group" aria-label="切換">
    <button type="button" data-tab="fb" aria-pressed="true">玩家留言<span class="n" id="nFb"></span></button>
    <button type="button" data-tab="rp" aria-pressed="false">題目回報<span class="n" id="nRp"></span></button>
    <button type="button" data-tab="st" aria-pressed="false">數據</button>
    <button type="button" data-tab="sc" aria-pressed="false">計分</button>
    <button type="button" data-tab="pz" aria-pressed="false">題庫</button>
    <button type="button" data-tab="sk" aria-pressed="false">棋具</button>
  </div>
  <div class="filt" id="filt" role="group" aria-label="篩選">
    <button type="button" data-f="open" aria-pressed="true">未處理</button>
    <button type="button" data-f="all" aria-pressed="false">全部</button>
  </div>
</header>
<main id="list" aria-live="polite"><p class="msg">載入中…</p></main>
<script>document.write('<script src="/game/skin.js?v=' + Date.now() + '"><\/script>');</script><!-- 每次都抓最新的清單，不吃瀏覽器快取 -->
<script>
'use strict';
const SITE = 'https://rush.hangsau.app';
const KIND = { answer: '答案有問題', unfair: '題目不合理', other: '其他' };
const ST = { open: '未處理', done: '已處理', blocked: '已停用' };
let tab = 'fb', filt = 'open', fb = [], rp = [];
const $ = (id) => document.getElementById(id);
const when = (t) => new Date(t).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(label, cls, fn) { const b = el('button', cls, label); b.type = 'button'; b.onclick = async () => { b.disabled = true; try { await fn(); } finally { b.disabled = false; } }; return b; }
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 403) throw new Error('登入過期，請重新整理頁面');
  if (!r.ok) throw new Error('伺服器回 ' + r.status);
  return r.json();
}
async function load() {
  try {
    const [a, b] = await Promise.all([api('/admin/feedback'), api('/admin/reports')]);
    fb = a.rows; rp = b.rows; render();
  } catch (e) { $('list').innerHTML = ''; $('list').appendChild(el('p', 'msg', '讀不到資料：' + e.message)); }
}
function groups() {   // 同一題的回報併成一張卡
  const m = new Map();
  for (const r of rp) { if (!m.has(r.pid)) m.set(r.pid, []); m.get(r.pid).push(r); }
  return [...m.values()].map(rs => ({ pid: rs[0].pid, rs, t: Math.max(...rs.map(r => r.t)), status: rs.some(r => r.status === 'blocked') ? 'blocked' : rs.some(r => r.status === 'open') ? 'open' : 'done' }))
    .sort((x, y) => y.t - x.t);
}
function render() {
  $('filt').hidden = tab === 'st' || tab === 'sc' || tab === 'pz' || tab === 'sk';
  if (tab === 'pz') return renderBank();
  if (tab === 'sk') return renderSkins();
  if (tab === 'st') return renderStats();
  if (tab === 'sc') return renderScoring();
  const g = groups();
  $('nFb').textContent = fb.filter(x => x.status === 'open').length || '';
  $('nRp').textContent = g.filter(x => x.status === 'open').length || '';
  const list = $('list'); list.innerHTML = '';
  if (tab === 'fb') {
    const rows = fb.filter(x => filt === 'all' || x.status === 'open');
    if (!rows.length) list.appendChild(el('p', 'msg', filt === 'open' ? '沒有未處理的留言' : '還沒有留言'));
    for (const x of rows) {
      const c = el('div', 'card' + (x.status === 'done' ? ' done' : ''));
      const meta = el('div', 'meta');
      meta.append(el('span', 'tag ' + x.status, ST[x.status] || x.status), el('span', '', when(x.t)), el('span', '', x.nick ? '暱稱：' + x.nick : '沒填暱稱'), el('span', '', x.lang || ''));
      c.append(meta, el('div', 'text', x.text));
      if (x.contact) c.append(el('div', 'contact', '聯絡方式：' + x.contact));
      const acts = el('div', 'acts');
      acts.append(x.status === 'open'
        ? btn('已處理', 'gold', async () => { await api('/admin/feedback', { id: x.id, status: 'done' }); x.status = 'done'; render(); })
        : btn('重新打開', '', async () => { await api('/admin/feedback', { id: x.id, status: 'open' }); x.status = 'open'; render(); }));
      c.append(acts); list.appendChild(c);
    }
  } else {
    const rows = g.filter(x => filt === 'all' || x.status === 'open');
    if (!rows.length) list.appendChild(el('p', 'msg', filt === 'open' ? '沒有未處理的回報' : '還沒有回報'));
    for (const x of rows) {
      const c = el('div', 'card' + (x.status !== 'open' ? ' done' : ''));
      const meta = el('div', 'meta');
      meta.append(el('span', 'tag ' + x.status, ST[x.status]), el('span', '', '#' + x.pid), el('span', '', x.rs.length + ' 則'), el('span', '', when(x.t)));
      c.append(meta);
      for (const r of x.rs) c.append(el('div', 'sub', (KIND[r.kind] || r.kind) + (r.text ? '：' + r.text : '')));
      const acts = el('div', 'acts'), f = x.rs[0];
      const a = el('a', '', '在試煉場打開'); a.target = '_blank'; a.rel = 'noopener';
      a.href = SITE + '/score#b=' + String(f.black || '').split(' ').join(',') + '&w=' + String(f.white || '').split(' ').join(',');
      acts.append(a);
      const set = (st) => async () => { await api('/admin/report', { pid: x.pid, status: st }); x.rs.forEach(r => r.status = st); render(); };
      if (x.status === 'open') acts.append(btn('已處理', 'gold', set('done')), btn('停用這題', 'ng', set('blocked')));
      else acts.append(btn('重新打開', '', set('open')));
      c.append(acts); list.appendChild(c);
    }
  }
}
// ---------- 數據分頁（2026-11-08 使用者：後台把數據也接進來）----------
// 算法照 vcf-slover/engine/game_stats.py（本機指揮台「遊戲」分頁），改那邊的常數這裡要一起改。
// 資料：/admin/runs（每局＋每題作答，不含暱稱）＋ 網站上的題庫狀態 game/p/index.json；玩家送來的字一律 esc。
// 段位尺（2026-11-08a 新評分）：LOW／START_AB 由 vcf-slover tools/apply_ladder.py 依 engine/rank_lines.json 改寫，不要手改
const RANKS = ['見習生', '初段', '二段', '三段', '四段', '五段', '六段', '七段', '八段', '九段', '傳說'];
const LOW = /*LADDER*/[0, 60, 86, 122, 175, 249, 349, 480, 649, 860, 1120]/*END*/;
const START_AB = /*START*/[45, 72, 102, 146, 209, 295, 409, 558, 747, 981, 1400]/*END*/;
const SCORE_VER = '2026-11-09b';   // 競速數據只算這一版評分的局（跟 worker.js CUR_VER 一致）；舊版的局不混進來
const SPREAD = 0.5, MIN_N = 30;
const WHY = { five: '對方連五', forbid: '被禁手', nofour: '沒四了', novcf: '下完沒 VCF（舊判定）', counter_nf: '被反四', counter_fb: '被反四', counter_nv: '被反四', skip: '跳過', time: '時間到', eyx: '第一手不對', quit: '退出', mustblock: '沒擋四', lost: '被反殺', forbidden: '禁手（舊版）', notfour: '不是四（舊版）', bad: '其他', '': '其他' };
const CROCK = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const esc = (x) => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rankOf = (ab) => { let k = 0; while (k < RANKS.length - 1 && ab >= LOW[k + 1]) k++; return k; };
const expectP = (ab, d) => 1 / (1 + Math.exp((Math.log(Math.max(1e-6, d)) - Math.log(Math.max(1e-6, ab))) / SPREAD));
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const r1 = (x) => Math.round(x * 10) / 10;
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const whyOf = (a) => WHY[a.wk || ''] || '其他';
const scoreHref = (b, w) => SITE + '/score#b=' + String(b || '').split(' ').join(',') + '&w=' + String(w || '').split(' ').join(',');
async function puzzleId(b, w, a) {   // 跟 game.html、export_game_puzzles.puzzle_id 同一個算法
  const norm = s => String(s || '').split(' ').filter(Boolean).sort().join(' ');
  const h = new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(`${norm(b)}|${norm(w)}|${a}`)));
  let n = 0n; for (let i = 0; i < 5; i++) n = (n << 8n) | BigInt(h[i]);
  let out = ''; for (let i = 0; i < 8; i++) out += CROCK[Number((n >> BigInt(35 - 5 * i)) & 31n)];
  return out;
}
function cell(A) {
  const n = A.length, ok = A.filter(a => a.ok), secs = ok.map(a => a.sec).filter(Number.isFinite);
  return { n, enough: n >= MIN_N, solve: n ? pct(ok.length, n) : null, expect: n ? Math.round(A.reduce((s, a) => s + a._p, 0) / n * 100) : null, sec: secs.length ? r1(median(secs)) : null };
}
let stats = null, statsErr = '';
async function loadStats() {
  stats = null; statsErr = '';
  try {
    const [runs, bank] = await Promise.all([api('/admin/runs'), fetch(SITE + '/game/p/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)]);
    stats = await summarize(runs.rows, bank);
  } catch (e) { statsErr = e.message; }
  if (tab === 'st') render();
}
async function summarize(rows, bank) {
  const allRuns = rows.length, allToday = rows.filter(r => r.day === new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10)).length;
  rows = rows.filter(r => (r.ver || '2026-11-07') === SCORE_VER);
  const runs = rows.map(r => { let d = []; try { d = JSON.parse(r.detail || '[]'); } catch {} return { ...r, att: Array.isArray(d) ? d : [] }; });
  const played = runs.filter(r => r.att.length);
  const atts = [];
  for (const r of played) for (const a of r.att) {
    const s = Number(a.s) || 0;
    if (s <= 0) continue;
    atts.push({ ...a, _fr: r.final_rank, _pr: rankOf(s), _p: expectP(r.ab || 1, s) });
  }
  const frs = [...new Set(atts.map(a => a._fr))].sort((x, y) => x - y), prs = [...new Set(atts.map(a => a._pr))].sort((x, y) => x - y);
  const table = frs.map(f => ({ fr: RANKS[f], cells: prs.map(p => cell(atts.filter(a => a._fr === f && a._pr === p))) }));
  const per = frs.map(f => {
    const A = atts.filter(a => a._fr === f), why = {};
    for (const a of A) if (!a.ok) why[whyOf(a)] = (why[whyOf(a)] || 0) + 1;
    const warn = A.filter(a => 'wf' in a);
    return { fr: RANKS[f], runs: played.filter(r => r.final_rank === f).length, n: A.length, why: Object.entries(why).sort((x, y) => y[1] - x[1]),
      side: { b: cell(A.filter(a => (a.a || 'b') === 'b')), w: cell(A.filter(a => a.a === 'w')) }, warnN: warn.length,
      wf: warn.length ? Math.round(warn.reduce((s, a) => s + a.wf, 0) / warn.length * 100) / 100 : null, wn: warn.length ? Math.round(warn.reduce((s, a) => s + a.wn, 0) / warn.length * 100) / 100 : null };
  });
  const trans = {};
  for (const r of played) { trans[r.start_rank] = trans[r.start_rank] || {}; trans[r.start_rank][r.final_rank] = (trans[r.start_rank][r.final_rank] || 0) + 1; }
  const flow = Object.keys(trans).map(Number).sort((x, y) => x - y).map(s => {
    const t = trans[s], tot = Object.values(t).reduce((x, y) => x + y, 0);
    const up = Object.entries(t).filter(([f]) => +f > s).reduce((x, [, v]) => x + v, 0), dn = Object.entries(t).filter(([f]) => +f < s).reduce((x, [, v]) => x + v, 0);
    return { start: RANKS[s], n: tot, up: pct(up, tot), keep: pct(tot - up - dn, tot), down: pct(dn, tot), to: Object.entries(t).sort((x, y) => x[0] - y[0]).map(([f, v]) => [RANKS[f], v]) };
  });
  const paths = played.slice(-12).reverse().map(r => { let ab = START_AB[Math.min(r.start_rank, 7)]; const p = [Math.round(ab)]; for (const a of r.att) { ab += a.e || 0; p.push(Math.round(ab)); } return { start: RANKS[r.start_rank], final: RANKS[r.final_rank], path: p }; });

  if (!skLoaded) msg.textContent = msg.textContent || '讀取開關狀態中…';
}
